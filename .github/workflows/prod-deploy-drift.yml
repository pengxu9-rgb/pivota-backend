# Does production actually run what `main` says it runs? All three services, not just `web`.
#
# Before the 2026-08-22 cutover, a merge to main auto-deployed to Railway prod, so "merged"
# and "shipped" were the same event. Between the cutover and 2026-08-26 they were not: GCP
# Cloud Run only moved when a human ran infra/gcp/deploy_backend.sh (later, the deploy-prod
# dispatch), and nothing else reported the gap.
#
# It bit once in that window: #1812 (a seed refresh that could never correct a stale price)
# merged 78 minutes after the flip, deployed itself to the rollback, and left production on
# the previous commit. Nobody was told, and the Railway host still answered /__build with a
# newer, confidently-green commit than production.
#
# Since 2026-08-26, deploy-prod.yml deploys `web` on every push to main again. This job STAYS:
# it is now the independent check on that pipeline - a deploy workflow that silently fails,
# skips, or is dropped by GitHub re-creates exactly the gap it was built to close, and this is
# the only thing that would say so. It does not deploy; it only says out loud when live != main.
#
# ── AND IT NOW WATCHES ALL THREE SERVICES ──────────────────────────────────────────────────────
# Until 2026-09-05 this job asked exactly one question - what does api.pivota.cc/health say - and
# api.pivota.cc is `web`. So `worker` and `proof-issuer` were not merely deployed by hand, they
# were UNWATCHED, and the alarm's silence about them read exactly like the silence about a `web`
# that was fine. Measured the day this changed:
#
#   worker         94 commits behind `web`, for a month. It is the service that runs every
#                  APScheduler tick and every queue drainer, so a month of scheduler-lane merges -
#                  #2074 and #2077 among them - were dark while this job reported green.
#   proof-issuer   184 commits and 9 days behind, and nobody had said so anywhere.
#
# Both now deploy from deploy-prod.yml. That is the fix; THIS is what makes the fix observable,
# and the distinction matters: an auto-deploy that silently fails, skips or is dropped rebuilds
# the identical gap, and a pipeline is not allowed to be its own only witness.
#
# HOW EACH IS READ, and why they differ. `web` is still read by curling the PUBLIC health endpoint:
# that traverses DNS, the load balancer and the traffic split, so it answers "what are users
# actually reaching", which describing the service cannot. `worker` (--ingress internal) and
# `proof-issuer` answer no probe from here, so they are read from the Cloud Run admin API - the
# image tag on the serving revision. That is a weaker signal, and it is named as such below.
name: prod deploy drift

on:
  push:
    branches: [main]
  schedule:
    # Every 4h, not hourly. One undeployed gap is ONE fact; re-reporting it every hour turns a
    # true alarm into a mailing list. On 2026-08-25, a day that held two separate undeployed
    # gaps, this workflow sent 7 scheduled failure notifications and the gateway sent 10 - the
    # volume, not the verdict, is what makes an alarm get muted. :17 still, to stay out of the
    # gateway's :37 slot.
    #
    # WHY THESE HOURS AND NOT `*/4`. GitHub drops scheduled runs under load, and it drops the
    # midnight one hardest: across 08-23..08-26, 5 of 59 nominal hourly slots never ran and
    # THREE of the five were 00:17 - every midnight slot sampled. Losing one slot out of 24
    # costs an hour; losing one out of six leaves a 20:17-04:17 blind window and pushes
    # worst-case detection past the "same morning" this file promises. Starting at 02:17 keeps
    # the 4h cadence and skips the slot GitHub is least likely to deliver.
    - cron: '17 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # `worker` is --ingress internal and answers no public probe, and `proof-issuer` sits behind
  # a URL nothing publishes. Both are read through the Cloud Run admin API instead, which needs
  # the OIDC token WIF exchanges. NOT a route into the VPC and NOT a database credential - see
  # tests/test_no_scheduled_workflow_reaches_cloud_sql.py for the thing this must never become.
  id-token: write

env:
  # How long production may lag main before this job goes red. Long enough that a normal
  # merge-then-deploy never trips it; short enough that a forgotten deploy is caught the same
  # working day - not the same morning, since grace plus a cron interval can now reach ~9h.
  # Only applies when production is BEHIND main, never when it has diverged.
  #
  # 120 was too twitchy for how this repo actually merges. Measured over the 14 days to
  # 2026-08-25, the span from a day's first merge to its last was a MEDIAN of 13.7h (p75 17.4h,
  # max 23.2h) - work lands across the whole day and ships in batches, so a 2h window went red
  # during ordinary afternoons.
  #
  # WHY NOT MUCH LONGER, which is the tempting fix. Sizing the window so a normal day never
  # trips it means ~14h, and that is not a weaker alarm - it is an off one. Replayed against
  # 2026-08-25: at 480m this job would have gone red ZERO times, and the 8-hour gap holding
  # #1865 (an anonymous admin-JWT escalation fix) would have gone entirely unreported. The
  # alarm is the only reason anyone looked. 240 still catches that gap; it just stops shouting
  # about a merge from ninety minutes ago.
  #
  # Worst case to detection is grace + one cron interval = 8h, plus however late GitHub actually
  # runs the job: measured on this workflow the schedule arrives a median of 36 minutes past the
  # nominal minute (p90 51m), so the real ceiling is ~9h, not 8.
  GRACE_MINUTES: '240'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. Every question this job asks - is the live SHA an
          # ancestor of main, how many commits behind is it, is the gap docs-only - can only
          # be answered if the live commit exists in this checkout. Under a shallow clone it
          # never does, so the job fell through to its "cannot classify" branch on EVERY run
          # and reported a divergence that had not happened. That also made the docs-only
          # exemption below unreachable, which is the exact crying-wolf this job must avoid.
          # blob:none keeps it cheap: the diffs here are --name-only, which needs trees, not
          # file contents.
          fetch-depth: 0
          filter: blob:none

      - uses: google-github-actions/auth@v2
        with:
          # Identifiers, not secrets - the same pair deploy-prod.yml uses. Neither grants anything
          # without a GitHub-signed OIDC token asserting this repository and refs/heads/main.
          # This job only ever calls `run services describe`; it deploys nothing.
          workload_identity_provider: projects/371394967380/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: sa-github-deploy@pivota-shared.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compare live production against this commit
        run: |
          set -uo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "main: $MAIN_SHA"
          echo

          # Every service that ships from THIS repository's backend image. The gateway is absent
          # deliberately: it builds from PIVOTA-Agent, so its commits are not in this history and
          # every question below would be unanswerable for it.
          #
          # ADDING A SERVICE HERE IS THE WHOLE MAINTENANCE STORY. A new Cloud Run service that runs
          # this image and is not in this list is exactly the `worker` situation again - deployed
          # somehow, watched by nothing.
          SERVICES="web worker proof-issuer"
          DRIFTED=""

          # ── HOW EACH SERVICE'S LIVE COMMIT IS READ ─────────────────────────────────────────────
          # web: the PUBLIC health endpoint, because that traverses DNS, the load balancer and the
          # traffic split, and so answers "what are users actually reaching". Describing the
          # service cannot answer that - it reports the spec, which is upstream of every one of
          # those hops. If DNS ever moves, this still reads whatever is really serving.
          live_sha_web(){
            local json sha
            json="$(curl -fsS --max-time 25 https://api.pivota.cc/health || true)"
            [ -n "$json" ] || { echo "::error::could not reach https://api.pivota.cc/health - production health is unknown" >&2; return 1; }
            sha="$(printf '%s' "$json" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("version") or {}).get("full_sha",""))' 2>/dev/null)"
            [ -n "$sha" ] || { echo "::error::/health returned no version.full_sha - cannot verify what web runs" >&2; return 1; }
            printf '%s' "$sha"
          }

          # worker and proof-issuer: the image on the revision that is actually SERVING, via the
          # Cloud Run admin API. Neither can be probed from a GitHub runner - worker is
          # `--ingress internal`, and Google's front end answers 404 before the request reaches
          # the app even with a valid identity token.
          #
          # NOT `spec.template`, AND THIS IS THE WHOLE CORRECTNESS OF THE JOB. `spec.template` is
          # the template of the LAST REVISION CREATED, which is not the same thing as the one
          # taking traffic. deploy_backend.sh - which is how proof-issuer ships - creates every
          # revision `--tag c-<sha> --no-traffic`, health-checks it, and only then promotes; if
          # that health check fails it exits 1 and leaves the candidate at 0% with the PREVIOUS
          # revision still serving. Read from `spec.template`, this job would then report the new
          # sha and go green for a deploy that FAILED, and keep doing so - an alarm quietly
          # certifying the success of the exact event it exists to catch. Resolve the 100%-traffic
          # revision and read ITS image instead. Found in review, 2026-09-05.
          #
          # A SPLIT traffic state has no single answer, so it is refused rather than guessed at.
          # That is not hypothetical tidiness: a 0%-traffic candidate left behind by a
          # half-finished deploy is precisely the state this job most needs to not paper over.
          #
          # SAY WHAT THIS SIGNAL IS WORTH. An image tag is still the CONFIGURATION, not a running
          # process: it cannot see a revision that boots and does nothing, which for the worker is
          # a real and silent failure mode (a scheduler that raised on boot still serves 200). The
          # deploy-time check for that lives in deploy_worker.sh, which probes /__scheduler_health
          # from inside the VPC. What this job answers is narrower and is the question it was
          # built for: is the commit that is SERVING the one main says it should be.
          live_sha_image(){
            local svc="$1" rev image tag
            rev="$(gcloud run services describe "$svc" --project pivota-prod --region us-west1 --format=json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); live=[t["revisionName"] for t in (d.get("status",{}).get("traffic") or []) if t.get("percent")==100 and t.get("revisionName")]; print(live[0] if len(live)==1 else "")' 2>/dev/null || true)"
            if [ -z "$rev" ]; then
              echo "::error::could not resolve a single 100%-traffic revision for '$svc' - the service is" >&2
              echo "::error::either undescribable or its traffic is split. What it serves is unknown." >&2
              return 1
            fi
            image="$(gcloud run revisions describe "$rev" --project pivota-prod --region us-west1 --format='value(spec.containers[0].image)' 2>/dev/null || true)"
            [ -n "$image" ] || { echo "::error::could not describe revision '$rev' of '$svc' - what it runs is unknown" >&2; return 1; }
            tag="${image##*:}"
            # The tag is about to be handed to `git cat-file` / `git merge-base` as a REVISION
            # EXPRESSION, so ANY string git can resolve would be accepted as "the live commit".
            # A moving tag is the realistic way that happens - an image tagged `latest`, or `main`,
            # resolves against this checkout and the job reports "running main" having compared
            # production to itself. Demand a full sha, the same check deploy-prod.yml applies to
            # its dispatch input. A digest ref (`...@sha256:<64hex>`) is refused too: 64, not 40.
            case "$tag" in
              ""|*[!0-9a-f]*) echo "::error::'$svc' serves image tag '$tag', which is not a commit sha - refusing to read it as one" >&2; return 1 ;;
            esac
            [ "${#tag}" = 40 ] || { echo "::error::'$svc' serves image tag '$tag' (${#tag} chars, want 40) - refusing to read it as a commit" >&2; return 1; }
            printf '%s' "$tag"
          }

          # ── THE CLASSIFICATION, UNCHANGED IN SUBSTANCE, NOW APPLIED PER SERVICE ────────────────
          # classify <service> <live_sha> -> 0 in sync (or forgiven), 1 drifted
          classify(){
            local svc="$1" live="$2" runtime landed age behind rt_list c

            if [ "$live" = "$MAIN_SHA" ]; then
              echo "  $svc: running main"
              return 0
            fi

            # Not every commit needs a deploy. Docs, runbooks, the infra scripts and this workflow
            # never enter the container image, so a gap made only of those is not a production
            # problem - and failing on it would train everyone to ignore this job. That matters:
            # an alarm that cries wolf is worse than no alarm, because it launders a real one.
            #
            # Anything NOT in this list is treated as runtime-affecting, so the default is to
            # alarm. A new top-level directory is a deploy until someone says otherwise.
            if git cat-file -e "$live" 2>/dev/null; then
              runtime="$(git diff --name-only "$live..HEAD" \
                | grep -vE '^(docs/|infra/|\.github/|scripts/|tests/|README|CHANGELOG)' \
                | grep -vE '\.md$' || true)"
              if [ -z "$runtime" ]; then
                echo "  $svc: $(git rev-list --count "$live..HEAD") commit(s) behind main, none touching code the container runs - no deploy needed"
                return 0
              fi
            else
              echo "::warning::$svc runs $live, which is not in this repository at all. With full"
              echo "history that means a build from a commit that was force-pushed away, or from"
              echo "another repo. Treating as runtime drift."
              runtime=""
            fi

            # A merge that landed seconds ago is a PENDING DEPLOY, not drift. Every merge of
            # runtime code would otherwise make this job red instantly, before any deploy could
            # possibly have finished - which is a notification on every merge, not an alarm, and
            # it trains people to ignore the job that then launders the real drift.
            #
            # Measure when the code LANDED ON MAIN, not when it was written. Commit timestamps are
            # wrong for this: a branch developed over two hours and then merged has commits that
            # look two hours stale the instant they arrive. Walking --first-parent gives the merge
            # that put the change on main, whose committer date IS the moment this service fell
            # behind.
            #
            # Anchored to files whose CONTENT still differs, not to files a commit happened to
            # touch: main carries commits whose content is already deployed (a branch squash-merged
            # and then merged again re-introduces them), and those must not count as undeployed.
            #
            # The window applies ONLY to "behind". A DIVERGED service means someone deployed
            # something that is not on main, which is never a pending deploy and is never delayed.
            if [ -n "$runtime" ] && git merge-base --is-ancestor "$live" HEAD 2>/dev/null; then
              rt_list="$(mktemp)"; printf '%s\n' "$runtime" > "$rt_list"
              landed=""
              for c in $(git rev-list --reverse --first-parent "$live..HEAD"); do
                if git diff --name-only "$c^" "$c" 2>/dev/null | grep -qFxf "$rt_list"; then
                  landed="$(git show -s --format=%ct "$c")"; break
                fi
              done
              rm -f "$rt_list"
              if [ -n "$landed" ]; then
                age=$(( ( $(date -u +%s) - landed ) / 60 ))
                if [ "$age" -lt "$GRACE_MINUTES" ]; then
                  echo "  $svc: undeployed runtime code landed ${age}m ago, inside the ${GRACE_MINUTES}m window - not alarming yet. A later scheduled run will."
                  return 0
                fi
              fi
            fi

            if git merge-base --is-ancestor "$live" HEAD 2>/dev/null; then
              behind="$(git rev-list --count "$live..HEAD" 2>/dev/null || echo '?')"
              echo "::error::$svc is $behind commit(s) BEHIND main and will stay there until someone deploys."
              echo "  runtime-affecting files not in $svc:"
              printf '%s\n' "$runtime" | sed 's/^/    /'
              echo "  commits not in $svc:"
              git log --oneline "$live..HEAD" | sed 's/^/    /'
            else
              echo "::error::$svc runs $live, which is NOT an ancestor of main - the two have diverged."
            fi
            return 1
          }

          # ── RUN ALL THREE, THEN REPORT ────────────────────────────────────────────────────────
          # Every service is evaluated even after one fails. A loop that exited on the first drift
          # would report `worker` and never mention `proof-issuer`, and the operator would fix one,
          # re-run, and find the next - which is how a two-service gap gets discovered one service
          # at a time over two days.
          UNREADABLE=0
          for svc in $SERVICES; do
            case "$svc" in
              web) LIVE="$(live_sha_web)" || { UNREADABLE=1; continue; } ;;
              *)   LIVE="$(live_sha_image "$svc")" || { UNREADABLE=1; continue; } ;;
            esac
            echo "$svc: $LIVE"
            classify "$svc" "$LIVE" || DRIFTED="$DRIFTED $svc"
            echo
          done

          # An unreadable service is NOT a passing one. Whatever it runs is unknown, and this job's
          # entire job is to refuse to let "unknown" read as "fine".
          [ "$UNREADABLE" = 0 ] || { echo "::error::at least one service could not be read - see above"; exit 1; }
          # "no service is ALARMING" is not the same claim as "everything is on main" - a
          # docs-only gap and a merge inside the grace window both pass, deliberately, while the
          # service really is behind. Saying the stronger thing would make the passing line a
          # small lie, and this job's whole value is that its output can be believed.
          [ -n "$DRIFTED" ] || { echo "no service is drifted (some may be behind but forgiven - see above)"; exit 0; }

          echo "::error::drifted:$DRIFTED"
          cat <<'EOF'

          To ship main to production, prefer the pipeline - deploy-prod.yml deploys all three on
          every push to main, and the `deploy prod` workflow can be re-dispatched for any merged
          SHA. Reach for these only when that pipeline is the thing that is broken:

            gcloud builds submit --config infra/gcp/cloudbuild.backend.yaml --project pivota-shared \
              --substitutions=COMMIT_SHA=<sha> .

            web           infra/gcp/deploy_backend.sh prod <sha>
            worker        infra/gcp/deploy_worker.sh prod <sha>
            proof-issuer  SERVICE=proof-issuer IMAGE_NAME=backend ENV_PREFIX=proofissuer \
                            RUN_COMMAND=python \
                            RUN_ARGS="-m,uvicorn,proof_issuer_main:app,--host,0.0.0.0,--port,8080" \
                            CONFIG=preserve CPU_LIMIT=2 MEMORY_LIMIT=4Gi CONCURRENCY_LIMIT=80 \
                            MIN_INSTANCES=2 MAX_INSTANCES=20 \
                            infra/gcp/deploy_backend.sh prod <sha>

          The shape pins on proof-issuer are not optional: deploy_backend.sh's own constants are
          WEB's connection budget, and an unpinned roll cuts proof-issuer from concurrency 80 /
          maxScale 20 to 20 / 10 as a side effect. Scheduler triggers and Cloud Run Jobs are a
          separate concern - that is still setup_scheduler.sh.
          EOF
          exit 1
