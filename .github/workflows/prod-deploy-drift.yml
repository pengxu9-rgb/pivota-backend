# Does production actually run what `main` says it runs?
#
# Before the 2026-08-22 cutover, a merge to main auto-deployed to Railway prod, so "merged"
# and "shipped" were the same event. Between the cutover and 2026-08-26 they were not: GCP
# Cloud Run only moved when a human ran infra/gcp/deploy_backend.sh (later, the deploy-prod
# dispatch), and nothing else reported the gap.
#
# It bit once in that window: #1812 (a seed refresh that could never correct a stale price)
# merged 78 minutes after the flip, deployed itself to the rollback, and left production on
# the previous commit. Nobody was told, and the Railway host still answered /__build with a
# newer, confidently-green commit than production.
#
# Since 2026-08-26, deploy-prod.yml deploys `web` on every push to main again. This job STAYS:
# it is now the independent check on that pipeline - a deploy workflow that silently fails,
# skips, or is dropped by GitHub re-creates exactly the gap it was built to close, and this is
# the only thing that would say so. It does not deploy; it only says out loud when live != main.
name: prod deploy drift

on:
  push:
    branches: [main]
  schedule:
    # Every 4h, not hourly. One undeployed gap is ONE fact; re-reporting it every hour turns a
    # true alarm into a mailing list. On 2026-08-25, a day that held two separate undeployed
    # gaps, this workflow sent 7 scheduled failure notifications and the gateway sent 10 - the
    # volume, not the verdict, is what makes an alarm get muted. :17 still, to stay out of the
    # gateway's :37 slot.
    #
    # WHY THESE HOURS AND NOT `*/4`. GitHub drops scheduled runs under load, and it drops the
    # midnight one hardest: across 08-23..08-26, 5 of 59 nominal hourly slots never ran and
    # THREE of the five were 00:17 - every midnight slot sampled. Losing one slot out of 24
    # costs an hour; losing one out of six leaves a 20:17-04:17 blind window and pushes
    # worst-case detection past the "same morning" this file promises. Starting at 02:17 keeps
    # the 4h cadence and skips the slot GitHub is least likely to deliver.
    - cron: '17 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # How long production may lag main before this job goes red. Long enough that a normal
  # merge-then-deploy never trips it; short enough that a forgotten deploy is caught the same
  # working day - not the same morning, since grace plus a cron interval can now reach ~9h.
  # Only applies when production is BEHIND main, never when it has diverged.
  #
  # 120 was too twitchy for how this repo actually merges. Measured over the 14 days to
  # 2026-08-25, the span from a day's first merge to its last was a MEDIAN of 13.7h (p75 17.4h,
  # max 23.2h) - work lands across the whole day and ships in batches, so a 2h window went red
  # during ordinary afternoons.
  #
  # WHY NOT MUCH LONGER, which is the tempting fix. Sizing the window so a normal day never
  # trips it means ~14h, and that is not a weaker alarm - it is an off one. Replayed against
  # 2026-08-25: at 480m this job would have gone red ZERO times, and the 8-hour gap holding
  # #1865 (an anonymous admin-JWT escalation fix) would have gone entirely unreported. The
  # alarm is the only reason anyone looked. 240 still catches that gap; it just stops shouting
  # about a merge from ninety minutes ago.
  #
  # Worst case to detection is grace + one cron interval = 8h, plus however late GitHub actually
  # runs the job: measured on this workflow the schedule arrives a median of 36 minutes past the
  # nominal minute (p90 51m), so the real ceiling is ~9h, not 8.
  GRACE_MINUTES: '240'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. Every question this job asks - is the live SHA an
          # ancestor of main, how many commits behind is it, is the gap docs-only - can only
          # be answered if the live commit exists in this checkout. Under a shallow clone it
          # never does, so the job fell through to its "cannot classify" branch on EVERY run
          # and reported a divergence that had not happened. That also made the docs-only
          # exemption below unreachable, which is the exact crying-wolf this job must avoid.
          # blob:none keeps it cheap: the diffs here are --name-only, which needs trees, not
          # file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Compare live production against this commit
        run: |
          set -uo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "main:      $MAIN_SHA"

          # api.pivota.cc resolves to the GCP load balancer. If DNS ever moves back, this
          # reads whatever is actually serving users - which is the question being asked.
          LIVE_JSON="$(curl -fsS --max-time 25 https://api.pivota.cc/health || true)"
          if [ -z "$LIVE_JSON" ]; then
            echo "::error::could not reach https://api.pivota.cc/health - production health is unknown"
            exit 1
          fi

          LIVE_SHA="$(printf '%s' "$LIVE_JSON" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("version") or {}).get("full_sha",""))')"
          echo "live prod: ${LIVE_SHA:-<absent>}"

          if [ -z "$LIVE_SHA" ]; then
            echo "::error::/health returned no version.full_sha - cannot verify what production runs"
            exit 1
          fi

          if [ "$LIVE_SHA" = "$MAIN_SHA" ]; then
            echo "production is running main"
            exit 0
          fi

          # Not every commit needs a deploy. Docs, runbooks, the infra scripts and this workflow
          # never enter the container image, so a gap made only of those is not a production
          # problem - and failing on it would train everyone to ignore this job. That matters:
          # an alarm that cries wolf is worse than no alarm, because it launders a real one.
          #
          # Anything NOT in this list is treated as runtime-affecting, so the default is to
          # alarm. A new top-level directory is a deploy until someone says otherwise.
          if git cat-file -e "$LIVE_SHA" 2>/dev/null; then
            RUNTIME_CHANGED="$(git diff --name-only "$LIVE_SHA..HEAD" \
              | grep -vE '^(docs/|infra/|\.github/|scripts/|tests/|README|CHANGELOG)' \
              | grep -vE '\.md$' || true)"
            if [ -z "$RUNTIME_CHANGED" ]; then
              echo "production is $(git rev-list --count "$LIVE_SHA..HEAD") commit(s) behind main,"
              echo "but none of them touch code the container runs:"
              git diff --name-only "$LIVE_SHA..HEAD" | sed 's/^/  /'
              echo "no deploy needed."
              exit 0
            fi
            echo "runtime-affecting files not in production:"
            printf '%s\n' "$RUNTIME_CHANGED" | sed 's/^/  /'
          else
            echo "::warning::$LIVE_SHA is not in this repository at all. With full history that"
            echo "means production runs a build from a commit that was force-pushed away, or from"
            echo "another repo. Treating as runtime drift."
          fi

          # A merge that landed seconds ago is a PENDING DEPLOY, not drift. Deploys here are
          # deliberately manual, so every merge of runtime code is guaranteed to make this job red
          # instantly - before any human could possibly have deployed it. Measured over one day:
          # all 13 scheduled runs passed and the only failure was the push-triggered one. That is
          # not an alarm, it is a notification on every merge, and it trains people to ignore the
          # job - which then launders the real drift it exists to catch.
          #
          # So: alarm only once the gap has PERSISTED past a window long enough to deploy in.
          #
          # Measure when the code LANDED ON MAIN, not when it was written. Commit timestamps are
          # wrong for this: a branch developed over two hours and then merged has commits that look
          # two hours stale the instant they arrive, so a commit-time window would fire on exactly
          # the merges it is meant to forgive. Walking --first-parent gives the merge that put the
          # change on main, whose committer date IS the moment production fell behind.
          #
          # Anchored to files whose CONTENT still differs, not to files a commit happened to touch.
          # main carries commits whose content is already deployed (a branch squash-merged and then
          # merged again re-introduces them); those must not count as undeployed code.
          #
          # The window applies ONLY to "behind". A DIVERGED production means someone deployed
          # something that is not on main, which is never a pending deploy and is never delayed.
          if git merge-base --is-ancestor "$LIVE_SHA" HEAD 2>/dev/null; then
            RT_LIST="$(mktemp)"; printf '%s\n' "$RUNTIME_CHANGED" > "$RT_LIST"
            LANDED=""
            for c in $(git rev-list --reverse --first-parent "$LIVE_SHA..HEAD"); do
              if git diff --name-only "$c^" "$c" 2>/dev/null | grep -qFxf "$RT_LIST"; then
                LANDED="$(git show -s --format=%ct "$c")"; break
              fi
            done
            rm -f "$RT_LIST"
            if [ -n "$LANDED" ]; then
              AGE_MIN=$(( ( $(date -u +%s) - LANDED ) / 60 ))
              if [ "$AGE_MIN" -lt "$GRACE_MINUTES" ]; then
                echo "::notice::undeployed runtime code landed on main ${AGE_MIN}m ago, inside the ${GRACE_MINUTES}m deploy window - not alarming yet. A later scheduled run will."
                exit 0
              fi
              echo "this gap has been on main for ${AGE_MIN} minutes (window is ${GRACE_MINUTES})."
            fi
            BEHIND="$(git rev-list --count "$LIVE_SHA..HEAD" 2>/dev/null || echo '?')"
            echo "::error::production is $BEHIND commit(s) BEHIND main and will stay there until someone deploys."
            echo "commits not in production:"
            git log --oneline "$LIVE_SHA..HEAD" | sed 's/^/  /'
          else
            echo "::error::production runs $LIVE_SHA, which is NOT an ancestor of main - the two have diverged."
          fi

          cat <<'EOF'
          To ship main to production. Build once, then roll each service with ITS OWN tool -
          they are not interchangeable, and CONFIG=preserve is required on both scripts because
          the Railway-ported env files they default to no longer exist:

            gcloud builds submit --config infra/gcp/cloudbuild.backend.yaml --project pivota-shared \
              --substitutions=COMMIT_SHA=<sha> .

            # web
            CONFIG=preserve infra/gcp/deploy_backend.sh prod <sha>

            # proof-issuer (same image, different ASGI app; ENV_PREFIX is required for any non-web service)
            CONFIG=preserve SERVICE=proof-issuer IMAGE_NAME=backend ENV_PREFIX=proofissuer \
              RUN_COMMAND=python RUN_ARGS="-m,uvicorn,proof_issuer_main:app,--host,0.0.0.0,--port,8080" \
              infra/gcp/deploy_backend.sh prod <sha>

            # worker AND every backend Cloud Run Job - setup_scheduler.sh, NEVER deploy_backend.sh.
            # deploy_backend.sh hardcodes prod MIN=2/MAX=20 and --concurrency 80; the worker needs
            # min=max=1. services/audit_scheduler.py has no cross-process lock, so a second instance
            # means duplicate settlement attempts and duplicate invitation emails.
            # Safe to re-run: it reconciles definitions and changes no existing trigger's state.
            # Add ARM=<trigger>-cron to arm one lane; do NOT reach for PAUSED=0.
            infra/gcp/setup_scheduler.sh prod <sha> <gateway-sha>

          THIS ALARM ONLY SEES `web`. It reads api.pivota.cc/health, which is the web service.
          `worker` is ingress:internal and `proof-issuer` is internal-and-cloud-load-balancing with
          no public hostname, so neither can be probed from a runner and neither is checked here.
          They drifted 111 commits behind unnoticed on 2026-08-26. Until this workflow gets a
          read-only GCP identity, confirm them by hand after any deploy:

            for s in web worker proof-issuer; do
              gcloud run services describe $s --region us-west1 --project pivota-prod \
                --format="value(spec.template.spec.containers[0].image)"
            done
          EOF
          exit 1
