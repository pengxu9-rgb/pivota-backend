name: Agent Reliability Suite

on:
  workflow_dispatch:
    inputs:
      run_shopify_discount_validation:
        description: "Run Shopify discount validation. Defaults to dev/test unless live no-order mode is explicitly allowed."
        required: true
        default: false
        type: boolean
      allow_remote_dev_url:
        description: "Allow a non-localhost validation base URL."
        required: true
        default: false
        type: boolean
      allow_live_no_order:
        description: "Allow live quote/cart validation only. Blocks Shopify order creation and payment paths."
        required: true
        default: false
        type: boolean
      include_shopify_order_create:
        description: "Also run quote-to-order create. Dev/test only; incompatible with live no-order mode."
        required: true
        default: false
        type: boolean
      shopify_discount_test_base_url:
        description: "Optional validation base URL. Falls back to repo secret/variable."
        required: false
        default: ""
        type: string
      shopify_discount_fixture_env_json:
        description: "Optional JSON object of non-secret SHOPIFY_DISCOUNT_TEST_* fixture env vars."
        required: false
        default: "{}"
        type: string
  pull_request:
    paths:
      - "routes/**"
      - "services/**"
      - "db/**"
      - "models/**"
      - "tests/**"
      - "scripts/**"
      - "docs/ops/SHOPIFY_DISCOUNT_DEV_STORE_VALIDATION.md"
      - "docs/shopify-discount-*.md"
      # ANY workflow change, not just this file's: the workflow-hygiene gate below
      # polices `.github/workflows/**`, and a gate that does not run on the change
      # class it exists to police is not a gate. A PR adding a brand-new workflow
      # touches nothing else, so without this it would sail past every path filter.
      - ".github/workflows/**"

# Superseded PR pushes cancel the run for the commit they replaced. Dispatch
# runs fall through to run_id — a group of one — so manual validation runs are
# never cancelled or queued against each other.
concurrency:
  group: agent-reliability-suite-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quick-reliability:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_shopify_discount_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release source
        shell: bash
        env:
          EXPECTED_REPO_NAME: pivota-backend
          ALLOWED_BRANCH_REGEX: "^main$"
        run: |
          bash scripts/verify_release_source.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Workflow hygiene — see the test's own docstring for why it exists.
      #
      # Placed in THIS job rather than the payment-safety one because it has
      # nothing to do with payments, and a gate filed under the wrong heading is
      # a gate nobody maintains.
      #
      # And placed BEFORE the reliability suite, not after: steps default to
      # `if: success()`, so sitting downstream of 11 unrelated test files meant a
      # flaky shopify/JWT/cache test would suppress this sub-second check and
      # report "quick suite failed" instead of the hygiene violation. That could
      # never let a violation merge — the job is red either way — but it is a
      # smaller version of the exact "gate filed where it does not run" problem
      # this commit exists to fix. It needs only checkout + Python + deps.
      - name: Run workflow-hygiene gate
        run: |
          pytest -q tests/test_workflow_no_run_body_interpolation.py

      - name: Run quick reliability suite
        run: |
          ./scripts/run_agent_reliability_suite.sh quick

  checkout-payment-safety:
    name: Checkout Payment Safety
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_shopify_discount_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release source
        shell: bash
        env:
          EXPECTED_REPO_NAME: pivota-backend
          ALLOWED_BRANCH_REGEX: "^main$"
        run: |
          bash scripts/verify_release_source.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run checkout payment safety suite
        run: |
          pytest -q \
            tests/test_agent_external_platform_checkout.py \
            tests/test_order_routes_platform_checkout_fallback.py \
            tests/test_agent_payment_sdk_existing_surface.py \
            tests/test_agent_confirm_payment_contract.py \
            tests/test_order_payment_verification.py \
            tests/test_payment_execution_routes.py \
            tests/test_order_routes_psp_resolution.py \
            tests/test_psp_payment_finalizer.py \
            tests/test_stripe_webhook_contract.py \
            tests/test_adyen_webhook_contract.py \
            tests/test_checkout_webhook_contract.py \
            tests/test_stripe_payment_element_runtime.py \
            tests/test_stripe_idempotency_keys.py \
            tests/test_merchant_payment_initiation_service.py \
            tests/test_multi_psp_orchestrator_preferred_subset.py

      - name: Run payment aftercare gate
        env:
          PIVOTA_BACKEND_REPO: ${{ github.workspace }}
        run: |
          bash scripts/run_payment_aftercare_gate.sh

  shopify-discount-dev-store:
    name: Shopify discount validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_shopify_discount_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SHOPIFY_DISCOUNT_TEST_BASE_URL: ${{ inputs.shopify_discount_test_base_url || secrets.SHOPIFY_DISCOUNT_TEST_BASE_URL || vars.SHOPIFY_DISCOUNT_TEST_BASE_URL }}
      SHOPIFY_DISCOUNT_TEST_MERCHANT_ID: ${{ secrets.SHOPIFY_DISCOUNT_TEST_MERCHANT_ID || vars.SHOPIFY_DISCOUNT_TEST_MERCHANT_ID }}
      SHOPIFY_DISCOUNT_TEST_AGENT_API_KEY: ${{ secrets.SHOPIFY_DISCOUNT_TEST_AGENT_API_KEY }}
      SHOPIFY_DISCOUNT_TEST_PRODUCT_ID: ${{ secrets.SHOPIFY_DISCOUNT_TEST_PRODUCT_ID || vars.SHOPIFY_DISCOUNT_TEST_PRODUCT_ID }}
      SHOPIFY_DISCOUNT_TEST_VARIANT_ID: ${{ secrets.SHOPIFY_DISCOUNT_TEST_VARIANT_ID || vars.SHOPIFY_DISCOUNT_TEST_VARIANT_ID }}
      SHOPIFY_DISCOUNT_TEST_CUSTOMER_EMAIL: ${{ secrets.SHOPIFY_DISCOUNT_TEST_CUSTOMER_EMAIL || vars.SHOPIFY_DISCOUNT_TEST_CUSTOMER_EMAIL }}
      SHOPIFY_DISCOUNT_TEST_AMOUNT_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_AMOUNT_CODE || vars.SHOPIFY_DISCOUNT_TEST_AMOUNT_CODE }}
      SHOPIFY_DISCOUNT_TEST_AUTOMATIC_ENABLED: ${{ vars.SHOPIFY_DISCOUNT_TEST_AUTOMATIC_ENABLED }}
      SHOPIFY_DISCOUNT_TEST_BXGY_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_BXGY_CODE || vars.SHOPIFY_DISCOUNT_TEST_BXGY_CODE }}
      SHOPIFY_DISCOUNT_TEST_BXGY_QUANTITY: ${{ vars.SHOPIFY_DISCOUNT_TEST_BXGY_QUANTITY || '2' }}
      SHOPIFY_DISCOUNT_TEST_FREE_SHIPPING_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_FREE_SHIPPING_CODE || vars.SHOPIFY_DISCOUNT_TEST_FREE_SHIPPING_CODE }}
      SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_CODE || vars.SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_CODE }}
      SHOPIFY_DISCOUNT_TEST_EXHAUSTED_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_EXHAUSTED_CODE || vars.SHOPIFY_DISCOUNT_TEST_EXHAUSTED_CODE }}
      SHOPIFY_DISCOUNT_TEST_ACTIVE_WINDOW_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_ACTIVE_WINDOW_CODE || vars.SHOPIFY_DISCOUNT_TEST_ACTIVE_WINDOW_CODE }}
      SHOPIFY_DISCOUNT_TEST_INACTIVE_WINDOW_CODE: ${{ secrets.SHOPIFY_DISCOUNT_TEST_INACTIVE_WINDOW_CODE || vars.SHOPIFY_DISCOUNT_TEST_INACTIVE_WINDOW_CODE }}
      SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_A: ${{ secrets.SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_A || vars.SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_A }}
      SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_B: ${{ secrets.SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_B || vars.SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_B }}
      SHOPIFY_DISCOUNT_TEST_COMBINABLE_QUANTITY: ${{ vars.SHOPIFY_DISCOUNT_TEST_COMBINABLE_QUANTITY }}
      SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_A: ${{ secrets.SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_A || vars.SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_A }}
      SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_B: ${{ secrets.SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_B || vars.SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_B }}
      SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_QUANTITY: ${{ vars.SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_QUANTITY }}
      SHOPIFY_DISCOUNT_TEST_SHIPPING_ADDRESS1: ${{ vars.SHOPIFY_DISCOUNT_TEST_SHIPPING_ADDRESS1 || '350 Fifth Avenue' }}
      SHOPIFY_DISCOUNT_TEST_SHIPPING_CITY: ${{ vars.SHOPIFY_DISCOUNT_TEST_SHIPPING_CITY || 'New York' }}
      SHOPIFY_DISCOUNT_TEST_SHIPPING_STATE: ${{ vars.SHOPIFY_DISCOUNT_TEST_SHIPPING_STATE || 'NY' }}
      SHOPIFY_DISCOUNT_TEST_SHIPPING_POSTAL_CODE: ${{ vars.SHOPIFY_DISCOUNT_TEST_SHIPPING_POSTAL_CODE || '10118' }}
      SHOPIFY_DISCOUNT_TEST_SHIPPING_COUNTRY: ${{ vars.SHOPIFY_DISCOUNT_TEST_SHIPPING_COUNTRY || 'US' }}
      SHOPIFY_DISCOUNT_PREFLIGHT_ADMIN_KEY: ${{ secrets.SHOPIFY_DISCOUNT_PREFLIGHT_ADMIN_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply dispatch fixture env
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = {}
          if event_path:
              try:
                  with open(event_path, "r", encoding="utf-8") as event_file:
                      event = json.load(event_file) or {}
              except Exception as exc:
                  raise SystemExit(f"Unable to read GitHub event payload: {exc}") from exc
          raw = str(((event.get("inputs") or {}).get("shopify_discount_fixture_env_json") or "")).strip()
          if not raw or raw == "{}":
              sys.exit(0)

          allowed = {
              "SHOPIFY_DISCOUNT_TEST_MERCHANT_ID",
              "SHOPIFY_DISCOUNT_TEST_PRODUCT_ID",
              "SHOPIFY_DISCOUNT_TEST_VARIANT_ID",
              "SHOPIFY_DISCOUNT_TEST_CUSTOMER_EMAIL",
              "SHOPIFY_DISCOUNT_TEST_CURRENCY",
              "SHOPIFY_DISCOUNT_TEST_AMOUNT_CODE",
              "SHOPIFY_DISCOUNT_TEST_AUTOMATIC_ENABLED",
              "SHOPIFY_DISCOUNT_TEST_AUTOMATIC_ITEMS_JSON",
              "SHOPIFY_DISCOUNT_TEST_BXGY_CODE",
              "SHOPIFY_DISCOUNT_TEST_BXGY_ITEMS_JSON",
              "SHOPIFY_DISCOUNT_TEST_BXGY_QUANTITY",
              "SHOPIFY_DISCOUNT_TEST_FREE_SHIPPING_CODE",
              "SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_CODE",
              "SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_ENABLED",
              "SHOPIFY_DISCOUNT_TEST_NEW_CUSTOMER_ITEMS_JSON",
              "SHOPIFY_DISCOUNT_TEST_EXHAUSTED_CODE",
              "SHOPIFY_DISCOUNT_TEST_ACTIVE_WINDOW_CODE",
              "SHOPIFY_DISCOUNT_TEST_INACTIVE_WINDOW_CODE",
              "SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_A",
              "SHOPIFY_DISCOUNT_TEST_COMBINABLE_CODE_B",
              "SHOPIFY_DISCOUNT_TEST_COMBINABLE_ITEMS_JSON",
              "SHOPIFY_DISCOUNT_TEST_COMBINABLE_QUANTITY",
              "SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_A",
              "SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_CODE_B",
              "SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_ITEMS_JSON",
              "SHOPIFY_DISCOUNT_TEST_NONCOMBINABLE_QUANTITY",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_NAME",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_ADDRESS1",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_ADDRESS2",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_CITY",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_STATE",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_POSTAL_CODE",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_COUNTRY",
              "SHOPIFY_DISCOUNT_TEST_SHIPPING_PHONE",
          }
          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid shopify_discount_fixture_env_json: {exc}") from exc
          if not isinstance(parsed, dict):
              raise SystemExit("shopify_discount_fixture_env_json must be a JSON object")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in parsed.items():
                  if key not in allowed:
                      continue
                  if value is None:
                      continue
                  text = str(value)
                  if "\n" in text or "\r" in text:
                      raise SystemExit(f"Fixture env {key} must be single-line")
                  if len(text) >= 4:
                      print(f"::add-mask::{text}")
                  env_file.write(f"{key}={text}\n")
          PY

      - name: Validate required fixtures
        shell: bash
        run: |
          if [[ "${{ inputs.allow_live_no_order }}" == "true" && "${{ inputs.include_shopify_order_create }}" == "true" ]]; then
            echo "Live quote/cart validation cannot include Shopify order creation." >&2
            exit 1
          fi

          missing=()
          for key in \
            SHOPIFY_DISCOUNT_TEST_BASE_URL \
            SHOPIFY_DISCOUNT_TEST_MERCHANT_ID \
            SHOPIFY_DISCOUNT_TEST_AGENT_API_KEY \
            SHOPIFY_DISCOUNT_TEST_VARIANT_ID
          do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Shopify discount validation fixture env vars:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Run Shopify discount validation
        shell: bash
        run: |
          output_dir="artifacts/shopify-discount-validation/${GITHUB_RUN_ID}/quote-matrix"
          cmd=(
            python3 scripts/validate_shopify_discounts.py
            --output-dir "$output_dir"
          )
          if [[ "${{ inputs.allow_live_no_order }}" == "true" ]]; then
            cmd+=(--allow-live-no-order)
          else
            cmd+=(--allow-dev-store)
          fi
          if [[ "${{ inputs.allow_remote_dev_url }}" == "true" || "${{ inputs.allow_live_no_order }}" == "true" ]]; then
            cmd+=(--allow-remote)
          fi
          if [[ "${{ inputs.include_shopify_order_create }}" == "true" ]]; then
            export SHOPIFY_DISCOUNT_TEST_ORDER_CREATE=1
            cmd+=(--include-order-create)
          fi
          "${cmd[@]}"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-discount-validation-${{ github.run_id }}
          path: artifacts/shopify-discount-validation/**
          if-no-files-found: ignore
