name: Agent Reliability Suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "routes/**"
      - "services/**"
      - "db/**"
      - "models/**"
      - "tests/**"
      - "scripts/run_agent_reliability_suite.sh"
      - ".github/workflows/agent-reliability-suite.yml"

jobs:
  quick-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release source
        shell: bash
        env:
          EXPECTED_REPO_NAME: pivota-backend
          ALLOWED_BRANCH_REGEX: "^(main|deploy/.+|release/.+)$"
        run: |
          bash scripts/verify_release_source.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run quick reliability suite
        run: |
          ./scripts/run_agent_reliability_suite.sh quick
