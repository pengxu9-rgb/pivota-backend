name: Backend Test Sweep

# 89.6% OF THIS REPO'S TESTS RAN IN NO CI JOB.
#
# Measured 2026-07-29 on `origin/main`: 876 test files exist, 91 are named by
# some workflow, 7 belong to the Postgres dialect gate — leaving **785 (89.6%)**
# that no CI job executed. A green PR check said almost nothing about this repo.
#
# It was not cost. At introduction this job executed **9,219 tests in ~137s on
# CI** (72s locally); current counts live beside FLOOR in the assert step below.
# Roughly two minutes of compute was the entire distance between "CI is green"
# and "CI means something".
#
# (Review re-derived the coverage figure independently and got 806/876 = 92.0%
# uncovered, not 89.6%. My method counted path literals in ALL scripts/*.sh,
# including three no workflow invokes, which inflated "covered" from 70 to 91.
# The error was conservative, so the argument holds either way.)
#
# WHY IT HAPPENED, AND WHY THIS JOB IS GLOBBED. Every existing pytest workflow
# names its files by hand: `v3-audit-gate.yml` lists 26, `agent-reliability-
# suite.yml` 16 plus 15 more in the shell script it calls. A hand-maintained list
# only covers what someone remembered to add, and it silently fails to grow. The
# same mechanism left the rig-exclusion guards unexecuted (#1600) and #1829's
# error-taxonomy suite never run once. So this job takes a GLOB and a short,
# justified DENYLIST — the inverse shape. A new test file is covered the moment
# it lands; skipping it takes a deliberate edit here, in review.
#
# NOT included, deliberately: `tests/test_*_postgres.py`. Those belong to
# `postgres-dialect-gate.yml` and need a live Postgres service container. Running
# them here would either fail or, worse, silently skip.

on:
  pull_request:
    paths:
      # Derived by counting which top-level packages the SWEPT tests import,
      # not by intuition. The first cut listed services/routes/db/scripts/tests
      # and missed utils/ (51 importers), main.py (39), models/ (36), config/
      # (34), readiness/ (18), mvp/ (18), adapters/ (17). Worst of those:
      # `readiness/**` was absent while this job RUNS `readiness/tests` — a
      # change to readiness source, or to its own tests, skipped the gate
      # entirely. And the quarantine note below blames `config.settings`
      # mutation for the order-dependence while `config/` went unwatched.
      - 'services/**'
      - 'routes/**'
      - 'db/**'
      - 'scripts/**'
      - 'tests/**'
      - 'readiness/**'
      - 'utils/**'
      - 'models/**'
      - 'config/**'
      - 'mvp/**'
      - 'adapters/**'
      # The Shopify Web Pixel mapper is JavaScript and is not imported by the
      # Python sweep. Watch integration-only changes so its Node contract test
      # cannot be skipped when the runtime mapper changes.
      - 'integrations/**'
      - 'jobs/**'
      - 'middleware/**'
      - 'core/**'
      - 'catalog/**'
      # The commerce-agents adapter's tests run in this file's
      # commerce-agents-adapter job; without this line a change to the adapter
      # or its tests would skip that job entirely.
      - 'integrations/commerce-agents/**'
      # dashboard/ and orchestrator/ matched NO filter, and two of the tests in
      # tests/test_operations_authz_and_jwt_secret_enforcement.py exist to guard
      # exactly those two files — the orchestrator's publisher call signatures
      # and dashboard/core.py's model shapes. A PR touching only one of them ran
      # the sweep zero times while `CI Entrypoint`, the required check, went
      # green having executed nothing against it. Same shape as the realtime/,
      # infra/ and .github/ entries.
      - 'dashboard/**'
      - 'orchestrator/**'
      # psp/** is listed for a directory that does NOT exist: the whole
      # package was deleted on 2026-08-31 and
      # tests/test_dead_psp_connectors_removed.py asserts it stays gone.
      # A PR that re-adds only psp/ files -- exactly that regression --
      # matched none of these globs, so the sweep skipped and the
      # required check went green having never run the guard.
      - 'psp/**'
      - 'observability/**'
      # realtime/ was added for ws_guard.py's admission ceiling, which has since
      # been deleted along with the WebSocket surface it guarded. The line stays
      # because the reason generalises and still applies: realtime/metrics_store.py
      # now holds the role-scoping decision for /api/operations/dashboard-summary,
      # and the derivation above would not catch it — the tests that cover it
      # live in tests/, so the package looks watched via a path that only matches
      # when the TESTS change. A PR editing metrics_store.py alone would match no
      # filter, the sweep would not run, and `CI Entrypoint` - the required check
      # - would go green having executed nothing against it. Same shape as the
      # infra/ and .github/ entries below.
      - 'realtime/**'
      # infra/ is here for a test that IMPORTS nothing from it. The derivation
      # above counts which packages the swept tests import, and that method is
      # structurally blind to a test whose subject is a FILE IT READS:
      # tests/test_deploy_mounts_every_dropped_dsn.py parses deploy_backend.sh
      # and port_railway_env.py off disk. Without this line, reverting the mount
      # it guards produces a diff touching only infra/, no gate matches, and
      # `CI Entrypoint` - the required check - goes green having enforced
      # nothing. The test would still be collected; it just would never run for
      # the one change class it exists to catch.
      - 'infra/**'
      - 'main.py'
      - 'requirements*.txt'
      # Same shape, one directory over: tests/test_no_scheduled_workflow_reaches_cloud_sql.py
      # parses EVERY workflow off disk to stop a new scheduled lane from being
      # given a production DSN a GitHub runner cannot route to. Adding such a
      # workflow is by nature a .github-only diff, so without this the ratchet
      # is collected and never runs for the one change class it guards.
      # A superset of the line below; both are kept because the narrow one
      # states its own reason and the two are read separately.
      - '.github/workflows/**'
      - '.github/workflows/backend-test-sweep.yml'
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR pushes cancel the sweep for the commit they replaced. Non-PR
# events fall through to run_id — a group of one — so push-to-main and dispatch
# runs are never cancelled or queued: every main commit keeps its own result.
concurrency:
  group: backend-test-sweep-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Shopify Web Pixel mapper contract
        run: node --test tests/shopify_web_pixel_mapper.node.test.mjs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # THE QUARANTINE. Visible, justified, and meant to SHRINK.
      #
      # Kept in the workflow rather than a dotfile precisely so it is reviewed:
      # an invisible denylist just becomes the next hand-maintained list this job
      # exists to replace. Each entry states what is wrong and who should fix it.
      # Removing an entry is the definition of progress here.
      #
      #   test_runtime_hardcode_guard          — RED. Reports 3 hardcoded merchant
      #     ids in comments (services/pdp_renderability.py:219 and two siblings).
      #     A real finding; the guard is doing its job and the debt is unpaid.
      #   test_schema_guard_migration_coverage — ✅ FIXED and REMOVED from this
      #     list (#1624, issue #1617). It was the most valuable entry here:
      #     migration 187 added `merchant_onboarding.signup_source` with no
      #     self-heal entry, and it had been reporting that, red, from no CI job
      #     at all. Kept in the comment as the worked example — a quarantine
      #     entry is a promise to come back, and this is what honouring one looks
      #     like. 46 of 46 column-adding migrations are now covered, so this
      #     gate should stay green.
      #   test_audit_scheduler_worker_env_gate — RED (2 tests). Appeared after the
      #     2026-07-28 recon, so it is a recent regression, not ancient debt.
      #   test_external_seed_csv_import        — RED alone AND in the sweep.
      #   test_winnable_prompts                — RESOLVED, entry removed. The
      #     diagnosis written here was right: `tests/test_vertex_gemini_credentials.py`
      #     reloaded `config.settings` + `services.vertex_gemini` under patched
      #     env and never restored them, so a stale `vertex_ai_enabled=True` and
      #     a cached fake credential made gemini look usable and the deepseek
      #     fallback never fired. Fixed at the source in that file's fixture.
      #     Verified by running THIS command with only this line removed:
      #     pre-fix 2 failed, post-fix 10108 passed.
      #
      #     Worth knowing for the next entry: the same leak also broke
      #     `tests/test_w2_retailer_seller_model.py`, which never appeared here
      #     because its symptom needs `google-auth` ABSENT — CI installs it from
      #     requirements.txt, a bare dev venv does not. This job was green on
      #     main throughout while that test failed for every developer running
      #     the suite locally. A quarantine list records what CI can see, which
      #     is not the same as what is broken.
      #
      # FOUND BY THIS PR'S OWN STRAY-FILE GUARD: `readiness/tests/` is a whole
      # sub-package — 16 test files, 133 executed today — that ran in NO CI job either. It is
      # swept in here rather than deferred, because that much coverage now
      # beats a tidier denylist later. Two of its files are red and join the
      # quarantine:
      #   readiness/tests/test_real_merchant_goldens.py
      #   readiness/tests/test_shopify_live_source.py
      #
      #   readiness/tests/test_summary.py — ORDER-DEPENDENT, and found only by
      #     combining the two trees: green running `readiness/tests` alone, red
      #     inside the sweep. Exactly the effect the 2026-07-28 recon predicted —
      #     "a globbed job runs a different set than the full suite, so
      #     order-dependent tests flip in both directions". It is a
      #     `--deselect` rather than an `--ignore`, so it suppresses ONE TEST
      #     rather than the whole file.
      #
      # UN-QUARANTINED 2026-08-28: readiness/tests/test_routes.py (+54 executed).
      # Its 3 red tests were not a product bug — `fake_build_readiness_optimization`
      # had drifted from build_readiness_optimization (readiness/summary.py:3177
      # gained `segment`), so every call raised TypeError -> 500. Doubles repaired,
      # file green standalone AND inside this sweep. This mattered beyond tidiness:
      # while it sat here, the security tests pinning the test-PSP probe gate's
      # conjuncts (readiness/service.py) never ran in CI, so a mutant deleting the
      # ALLOW_TEST_PSP_PROBE kill switch passed the sweep. A quarantined file does
      # not just defer its own red tests; it silently swallows every test added to
      # it afterwards. The +54 is inside the ABS_SLACK=150 cap by design — see the
      # floor guard below, which sized that slack for exactly this un-quarantine.
      #
      # ⚠️ A denylist entry is a promise to come back, not a resolution. If this
      # list is the same length in a month, this job has become the thing it
      # replaced.
      - name: Run the uncovered suite
        id: sweep
        run: |
          set -o pipefail
          python -m pytest tests readiness/tests \
            --ignore=tests/test_runtime_hardcode_guard.py \
            --ignore=tests/test_audit_scheduler_worker_env_gate.py \
            --ignore=tests/test_external_seed_csv_import.py \
            --ignore=readiness/tests/test_real_merchant_goldens.py \
            --ignore=readiness/tests/test_shopify_live_source.py \
            --deselect 'readiness/tests/test_summary.py::test_build_readiness_optimization_serves_stale_then_refreshes_in_background' \
            --ignore-glob='tests/test_*_postgres.py' \
            -q --no-header -p no:randomly \
            --junitxml=sweep.xml 2>&1 | tee sweep.log

      # ASSERT THE GATE ACTUALLY GATED.
      #
      # The sibling failure this guards against: a glob that matches nothing, or
      # an --ignore typo'd into a directory, exits 0 having run almost nothing and
      # reports green. `postgres-dialect-gate.yml` solves this by failing on ANY
      # skip; that cannot work here, because this suite has LEGITIMATE
      # env-gated skips (migration harness, Postgres e2e; 33 at the 2026-08-26
      # calibration). So the equivalent
      # protection is a FLOOR on tests actually executed, plus per-subtree floors.
      #
      # ⚠️ THE FIRST VERSION OF THIS COMMENT WAS FALSE. It claimed 7,500 was
      # "high enough that losing a directory trips it". Review disproved it by
      # running the real command with one extra `--ignore=tests/services`:
      # 1,636 tests silently vanished, 7,583 executed, 83 above the floor, and
      # the job reported GREEN. A floor with 1,700 of slack is not a floor.
      #
      # Note the asymmetry that makes this the realistic failure: a typo'd
      # FILENAME in --ignore is harmless (pytest ignores nonexistent paths and
      # the test still runs), while a valid DIRECTORY is silent.
      #
      # So: floor raised to 12,000 against a measured 12,245 executed (recalibrated
      # 2026-08-26 from a green main run of THIS workflow — 12,278 collected,
      # 33 skipped; the previous 9,000 floor had grown ~3,200 of slack, more than
      # tests/services itself, i.e. exactly the "not a floor" hole above), AND
      # per-subtree
      # minimums, because a single global number cannot notice one tree leaving.
      # Raise these when the real numbers grow; never lower one to green a build.
      #
      # AND a SLACK CAP, because "raise these when the real numbers grow" is an
      # instruction to a human, and this file's own history shows what that is
      # worth: the 9,000 floor sat 3,245 below the 12,245 it was meant to guard
      # after 28 days (~116 executed tests/day over that window), so unattended,
      # the floor re-opens a tests/services-sized hole in about two weeks. The
      # cap makes decay visible instead of silent: when executed exceeds the
      # floor by more than the allowance, you are told to RAISE the floor.
      #
      # ⚠️ IT WARNS ON PRs AND FAILS ONLY ON push-to-main, and that asymmetry is
      # the whole design. Review of the first version measured the blast radius
      # of failing on PRs: this job feeds the REQUIRED `CI Entrypoint` check and
      # its paths filter matches nearly every backend PR, so the day the cap
      # trips, EVERY open PR reddens at once — including ones that added no
      # tests — and stays red until somebody lands a floor bump. That is a
      # repo-wide merge outage as the remedy for a floor being conservative.
      # Worse, main can cross the cap with no PR ever going red: two PRs each
      # branched below it merge green, and the next innocent PR inherits the
      # failure. On push-to-main the same finding is a red main build — loud,
      # attributable to the commit that crossed, and blocking nobody.
      #
      # A shrink never trips the cap (deletions only reduce executed), but note
      # the two bounds do tighten against each other: the cap pushes FLOOR up
      # toward the real count, and a FLOOR set AT the real count leaves no room
      # for a legitimate deletion. The error message prints the whole admissible
      # window for that reason. And a floor bump edits this file, which
      # `.github/workflows/**` in the PR triggers routes straight back through
      # this job, so every bump is verified by the run it gates.
      - name: Assert the sweep actually ran
        if: '!cancelled()'
        # Read as an env var, never interpolated into the run body — see
        # tests/test_workflow_no_run_body_interpolation.py.
        env:
          SWEEP_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, sys, math, collections, xml.etree.ElementTree as ET
          # 2026-09-06: 16,182 executed on main; the 14,500 floor had grown 1,682
          # of slack (cap 15,950) and the cap tripped, as designed, on the push
          # run for the Webflow telemetry PR (#2103), after passing advisory on
          # the PR itself. The deploy gate refused, so prod stayed on the prior
          # commit until this re-float landed. Re-floated into the window the
          # assert printed (14,711..16,182) at the same ~97%-of-measured:
          # ~480 tests of deletion headroom, cap 17,270.
          #
          # 2026-09-05: 14,973 executed on main; the 13,600 floor had grown 1,373
          # of slack (cap 14,960) and the cap tripped, as designed — on the
          # push-to-main run, where it is fatal, after passing advisory on the
          # PR that carried the tests. Re-floated into the window the assert
          # printed (13,612..14,973), at the same ~97%-of-measured the last
          # re-float used: ~470 tests of deletion headroom, cap 16,470.
          #
          # 2026-09-03: 14,027 executed on main; the 12,000 floor had grown 2,027
          # of slack (cap 13,200) and the cap tripped, as designed. Re-floated
          # into the window the assert printed (12,752..14,027).
          FLOOR = 15700
          # Slack allowance, global and per-subtree: 10% of the floor, but never
          # fewer than ABS_SLACK tests. The absolute term is not decoration — a
          # pure percentage is unusable on a small tree. readiness.tests
          # measures 79 against a floor of 70, so a 10% cap is 77: the green
          # build fails, and re-floating the floor to 73 only moves the cap to
          # 80.3, room for exactly ONE new test. It would also have made this
          # file's own stated goal a red build — un-quarantining
          # readiness/tests/test_routes.py adds 54 tests in one PR. A floor's
          # job is to notice a tree LEAVING; sizing its ceiling per-test is a
          # different, worse question.
          ABS_SLACK = 150
          SLACK = 1.10

          def cap(floor):
              return floor + max(ABS_SLACK, floor * (SLACK - 1))

          def floor_window(ran):
              """The floors that both admit `ran` and keep it under the cap."""
              lo = ran - ABS_SLACK if ran <= ABS_SLACK * 11 else math.ceil(ran / SLACK)
              return max(lo, 0), ran

          # Cap findings FAIL the job only on push-to-main; on a PR they are
          # annotations. See the ⚠️ paragraph above — failing PRs on this turns
          # a conservative floor into a repo-wide merge outage.
          ENFORCE_CAP = os.environ.get('SWEEP_EVENT') == 'push'
          # Per-subtree minimums. A single global number cannot notice ONE tree
          # leaving — the hole review demonstrated. (These are counted over
          # EXECUTED testcases only; the loop below says why.)
          #
          # Measured 2026-08-26 under that counting: tests.services=1682,
          # readiness.tests=79 — unchanged from the figures the recalibration
          # took from collected testcases, because today all 33 skips live
          # OUTSIDE both subtrees, so these floors carry over untouched. That
          # equality is a present-tense fact, not a property: the moment either
          # subtree gains an env-gated skip the two countings diverge, which is
          # the whole reason the loop below excludes skips. A green MAIN run is
          # a valid calibration source only while the pytest invocation AND the
          # counting logic are untouched; a PR that edits either must calibrate
          # against its own branch's CI run of the modified workflow — see the
          # ⚠️ below.
          #
          # ⚠️ Calibrate against the FINAL command, not an earlier one. My first
          # cut set readiness.tests>=90 from a run that used --ignore on
          # test_summary.py; switching to --deselect changed the count, and 90
          # would have failed the GREEN build. Caught before merge only because
          # the clean and mutant runs were compared side by side — a guard is
          # not verified until it has been run against a passing build too.
          # readiness.tests RAISED 70 -> 120 (2026-08-28), calibrated against this
          # branch's own sweep: 133 executed after un-quarantining test_routes.py.
          # REQUIRED by that un-quarantine, not cosmetic. At 70 the file could be
          # re-`--ignore`d tomorrow -- dropping the subtree back to 79 and taking
          # the probe-gate security tests with it -- and BOTH gates stay green
          # (79 >= 70; the global 12000 floor cannot see one file leave). The
          # decay warning would not fire either: cap(70) = 220, and 133 < 220, so
          # the job prints nothing. That is the "a floor with too much slack is
          # not a floor" failure this file documents above, reproduced by the
          # un-quarantine itself. 120 leaves 13 for a legitimate deletion while
          # still noticing the file leaving; cap(120) = 270 stays clear of 133.
          # tests.services: 1,852 executed on 2026-09-03 against a 1,600 floor
          # (cap 1,760); re-floated into its window (1,684..1,852).
          # tests.services: 1,967 executed on 2026-09-06 against the 1,800 floor
          # (cap 1,980) -- 13 tests from tripping on the next services test
          # added. Re-floated within its window (1,789..1,967) to 1,900:
          # ~67 of deletion headroom, cap 2,090.
          SUBTREES = {'tests.services': 1900, 'readiness.tests': 120}
          try:
              root = ET.parse('sweep.xml').getroot()
          except Exception as e:
              sys.exit(f"::error::could not read sweep.xml ({e}) — the sweep produced no results")
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          total = int(suite.get('tests', 0)); skipped = int(suite.get('skipped', 0))
          ran = total - skipped
          print(f"collected={total} skipped={skipped} executed={ran} floor={FLOOR}")

          # COUNT WHAT RAN, NOT WHAT WAS COLLECTED. The global floor above already
          # subtracts skips (`ran = total - skipped`); this loop did not, so a
          # subtree could go ENTIRELY INERT and still clear its minimum. Proven
          # against this very script: feed it a sweep.xml where all 79
          # `readiness.tests` cases carry <skipped/> and it printed
          # `subtree readiness.tests: 79 (min 70)` and exited 0.
          #
          # The global floor is not a backstop for that. 79 skips sit well inside
          # its 251 of headroom, so the whole readiness tree can stop executing
          # with both gates green. (tests.services is incidentally covered — 1,682
          # skips would blow through the global floor — but that is arithmetic
          # luck, not a guarantee, and it evaporates the moment the floor rises.)
          #
          # A MODULE-level skip was always caught, because it collapses collection
          # to one <testcase> per module. The gap is a per-test @pytest.mark.skipif
          # sweep, which keeps the case count identical and the execution count zero
          # — exactly the shape an environment-dependent guard degrades into.
          #
          # AND THE PREFIX IS ANCHORED on the following '.', so a future sibling
          # package counts toward its own floor or none: unanchored, a
          # `tests/services_v2` would have its tests counted toward
          # tests.services, letting that minimum be satisfied by a tree it does
          # not name. A no-op today (verified: anchored and unanchored give the
          # same 1682/79, and no testcase's classname equals a prefix exactly —
          # pytest emits dotted module paths, so there is always a '.' after a
          # package), which is the only time such a fix is cheap to make.
          by = collections.Counter()
          for tc in suite.iter('testcase'):
              if tc.find('skipped') is not None:
                  continue
              cn = tc.get('classname') or ''
              for prefix in SUBTREES:
                  if cn.startswith(prefix + '.'):
                      by[prefix] += 1
          bad, decayed = [], []

          def decay(name, value, floor):
              lo, hi = floor_window(value)
              decayed.append(f"{name}: {value} executed but its floor is only {floor} "
                             f"(cap {cap(floor):.0f}) — the floor has decayed and no "
                             f"longer bounds anything; set it between {lo} and {hi} in "
                             f"this file. Do NOT exceed {hi}: a floor above the real "
                             f"count fails as an under-floor error, and one set exactly "
                             f"AT it leaves no room to delete a test.")

          if ran < FLOOR:
              bad.append(f"only {ran} tests executed, floor is {FLOOR} — a glob or "
                         f"--ignore is matching more than intended; this job would have "
                         f"reported green having tested far less than it claims")
          elif ran > cap(FLOOR):
              decay('FLOOR', ran, FLOOR)
          for prefix, minimum in sorted(SUBTREES.items()):
              got = by[prefix]
              print(f"  subtree {prefix}: {got} executed (min {minimum})")
              if got < minimum:
                  bad.append(f"subtree {prefix} executed only {got}, minimum {minimum} — "
                             f"the tree was dropped, or its tests were mass-skipped")
              elif got > cap(minimum):
                  decay(f"subtree {prefix}", got, minimum)

          # A cap finding is advisory on a PR and fatal on push-to-main. Never
          # the reverse: an UNDER-floor finding is fatal everywhere, because it
          # means tests silently vanished from the run that is gating this PR.
          for d in decayed:
              print(f"::{'error' if ENFORCE_CAP else 'warning'}::{d}")
          if decayed and ENFORCE_CAP:
              bad.extend(decayed)
          elif decayed:
              print("(advisory on a pull request — raise the floor in a follow-up; "
                    "this becomes a failure on push-to-main)")
          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit("sweep floor invariants violated — an under-floor count means "
                       "tests silently vanished; an over-cap count means the floor has "
                       "decayed and must be raised (never lowered) in this file")
          PY

  # NEW TEST FILES MUST LAND INSIDE THE SWEPT TREES.
  #
  # The sweep covers `tests/**` and `readiness/tests/**`, and the
  # commerce-agents-adapter job below covers `integrations/commerce-agents/tests/`,
  # so the realistic way to create a new invisible test is to put it somewhere
  # else. Cheap insurance against the exact habit that produced the 92%. A tree
  # is listed as swept here ONLY while a job in this file runs it; the adapter
  # tree went red on main on 2026-09-03 for exactly that reason (its tests
  # needed packages the sweep does not install), and the job is the remedy, not
  # an exemption.
  #
  # ⚠️ IT KEYS ON CONTENT, NOT FILENAME — and the first version did not, which is
  # why it was RED on its own branch. Two pre-existing files start with `test_`
  # and are not tests at all:
  #   services/test_merchant_policy.py — a PRODUCTION module (the shared
  #     test/demo-merchant serving predicate, named as canonical by
  #     scripts/run_agent_reliability_suite.sh). Zero test functions.
  #   test_refund_api.py — a manual CLI debug helper whose own docstring says
  #     "manual run only". Zero test functions.
  # Allowlisting them by path would have worked and been wrong: the next
  # production module called `test_*.py` would fail the build again. pytest
  # collects on `python_files = test_*.py` AND a `test_*` function, so the guard
  # asks the same question pytest does.
  #
  # I claimed "verified both ways, including against a planted file". The
  # positive direction was verified; the negative was not, because it did not
  # pass. That is the failure this repo keeps paying for, committed inside a
  # change built to end it.
  new-tests-are-covered:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert every collectable test file lives in a swept tree
        run: |
          python - <<'PY'
          import subprocess, sys, os, re
          SWEPT = ('tests/', 'readiness/tests/', 'integrations/commerce-agents/tests/')
          COLLECTABLE = re.compile(r'^\s*(async\s+)?def\s+test_|^\s*class\s+Test', re.M)

          tracked = subprocess.run(['git', 'ls-files', '*.py'],
                                   capture_output=True, text=True).stdout.split()
          # pytest.ini sets `python_files = test_*.py`, so only that basename
          # pattern can be collected at all — mirror it exactly rather than
          # inventing a wider one.
          candidates = [p for p in tracked
                        if os.path.basename(p).startswith('test_')
                        and not p.startswith(SWEPT)]

          stray = []
          for p in candidates:
              try:
                  if COLLECTABLE.search(open(p, encoding='utf-8', errors='ignore').read()):
                      stray.append(p)
              except OSError:
                  pass

          if stray:
              print("::error::collectable test files outside the swept trees — these run in NO CI job:")
              for p in stray:
                  print(f"  {p}")
              sys.exit(1)
          skipped = len(candidates) - len(stray)
          print(f"clean — {len(candidates)} test_*.py outside swept trees, "
                f"{skipped} of them define no tests (production modules / manual helpers)")
          PY

  # integrations/commerce-agents/tests/ is swept by THIS job, not by `sweep`.
  # Those tests import the blueprint's packages (shopping_agent, commerce_common),
  # which are not on PyPI and not in requirements.txt, so the sweep cannot
  # collect them; they went red on main on 2026-09-03 as "collectable tests
  # outside the swept trees". The packages are installed here from the blueprint
  # repo at a pinned commit, and an executed-count floor keeps a green job that
  # ran nothing from counting as coverage.
  commerce-agents-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # anthropics/commerce-agents, "building commerce agents using claude",
      # 2026-08-31. Bump deliberately: the adapter is written against this
      # commit's StorefrontBackend contract.
      COMMERCE_AGENTS_REF: fd4d59224ab96b43c6dc6888207c67b3bd5a24cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the blueprint's packages at the pinned commit
        run: |
          git clone --quiet https://github.com/anthropics/commerce-agents.git "$RUNNER_TEMP/commerce-agents"
          git -C "$RUNNER_TEMP/commerce-agents" checkout --quiet "$COMMERCE_AGENTS_REF"
          python -m pip install --upgrade pip
          pip install -e "$RUNNER_TEMP/commerce-agents/commerce-common" \
                      -e "$RUNNER_TEMP/commerce-agents/shopping-agent/core" \
                      pytest pytest-asyncio httpx
      - name: Run the adapter tests
        working-directory: integrations/commerce-agents
        env:
          PYTHONPATH: .:tests
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --junitxml=adapter.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('adapter.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          ran = int(suite.get('tests', 0)) - int(suite.get('skipped', 0))
          FLOOR = 20  # 24 measured on 2026-09-03
          print(f"adapter tests executed={ran} floor={FLOOR}")
          if ran < FLOOR:
              sys.exit(f"::error::only {ran} adapter tests executed against a floor of {FLOOR} "
                       "— a green job that ran nothing is the failure this floor exists for")
          PY
