name: Gate Enforcement Audit

# WHO GUARDS THE THING NO PR CAN EDIT.
#
# lint.yml's entire design rests on `lint` being a REQUIRED status check: GitHub blocks a
# required check that never reports, which is what makes deleting, renaming, matrixing or
# path-filtering the job self-defeating instead of something a test has to anticipate.
#
# That setting lives in branch protection, outside the repository. No test in the tree can
# read it, no PR can change it, and — this is the point — nothing in the tree can NOTICE it
# being unset. Measured on 2026-09-10, the required contexts were `["CI Entrypoint"]` alone,
# with 0 required approvals and no CODEOWNERS file. `CI Entrypoint` derives what it expects
# from each workflow file ON THE PR HEAD, so it cannot pin anything a PR is free to rewrite.
#
# An unverified assumption about enforcement is precisely the class of defect this repository
# keeps shipping: `npm run test:node` was never invoked by any workflow while 66 suite names
# were counted as coverage; a Railway cron wrote `passed` ledger rows over an empty window for
# two weeks while the graph build was down. "It is required" is a claim, and this checks it.
#
# THIS JOB FAILS LOUDLY WHEN IT CANNOT TELL. A check that skips when its credentials are
# missing reports green over an unknown state, which is the same defect wearing a different
# hat. If `administration: read` is insufficient here, the fix is to grant it or to delete
# this workflow deliberately — not to let it degrade quietly.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # Also on any change to the gate itself, so removing lint.yml surfaces the question
  # immediately rather than at 06:17 tomorrow.
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - '.github/workflows/gate-enforcement-audit.yml'
      - 'ruff.toml'

permissions:
  contents: read
  administration: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The lint gate must be a required status check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          branch=main
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}/protection" > protection.json 2> api_err.txt; then
            echo "::error::Cannot READ branch protection for ${branch}, so this audit cannot tell"
            echo "::error::whether the lint gate is enforced. That is an unknown state, not a pass."
            echo "::error::Grant the workflow `administration: read` (or a PAT), or delete this"
            echo "::error::workflow deliberately. Do not leave it skipping."
            sed 's/^/  /' api_err.txt
            exit 1
          fi
          contexts=$(python3 -c "
          import json
          d = json.load(open('protection.json'))
          rsc = d.get('required_status_checks') or {}
          print('\n'.join(rsc.get('contexts') or []))
          ")
          echo "required contexts on ${branch}:"
          echo "${contexts}" | sed 's/^/  - /'
          if ! echo "${contexts}" | grep -qx "lint"; then
            echo "::error::\`lint\` is NOT a required status check on ${branch}."
            echo "::error::lint.yml is then advisory: a PR can delete it, rename its job, give it"
            echo "::error::a matrix or a paths filter, and nothing blocks — the required check"
            echo "::error::simply stops being expected. Add \`lint\` to the required contexts."
            exit 1
          fi
          echo "ok: \`lint\` is enforced on ${branch}"
