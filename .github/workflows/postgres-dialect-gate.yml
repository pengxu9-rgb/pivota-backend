name: Postgres Dialect Gate

# THE GATE THAT WAS MISSING.
#
# This repo's test suite runs on SQLite. Every other CI job here proves the code
# works against an engine production does not use. On 2026-07-26 that gap cost a
# 16-minute prod outage: #1588 shipped a SQLAlchemy `concat` with an untyped bind
# parameter, 149 tests passed, CI was green, two reviews signed off, and
# `GET /api/canonical/products` returned a hard 500 to every caller the moment it
# deployed (asyncpg `IndeterminateDatatypeError`). Reverted in #1590; relanded in
# #1591 with the parameter typed.
#
# The failure class is *statement PREPARE*, not query results. Postgres refuses to
# prepare a statement whose parameter type it cannot infer, and it refuses to
# parse a fragment whose SQL is malformed. Neither is visible to SQLite, to a
# dialect-compile assertion, or to code review — the 2026-07-27 sibling case
# (#1593) was a compiled SQL fragment that still carried SQLAlchemy's implicit
# `AS anon_1` label, so wrapping it in parens produced
# `syntax error at or near "AS"` while 142 SQLite tests stayed green.
#
# (To be exact about the compile-assertion claim: a compile-level check CAN catch
# a given regression once you know to write it — tests/test_pdp_content_depth.py
# has one that would have. What it cannot do is catch the NEXT one, because the
# assertion has to be authored against a defect you have already met. Executing
# the statement needs no foreknowledge, which is the whole argument for this job.)
#
# So this job EXECUTES the real route against a real Postgres — today exactly one,
# `list_canonical_pdp_signatures`, via the single gate file that exists. Empty
# tables are deliberate: a populated fixture that is subtly wrong about
# eligibility semantics produces exactly the false confidence this exists to
# prevent. Row-level semantics stay in the SQLite matrices, which are the right
# engine for them (fast, no server) — though note honestly that those matrices
# are in no CI job either. That is a separate gap, not one this workflow closes.
#
# ── THE ONE GOTCHA ─────────────────────────────────────────────────────────────
# If DATABASE_URL is not a Postgres URL before pytest imports anything, the
# `pytestmark = skipif` in each gate file skips the whole module and this job
# goes GREEN having tested nothing. (Until 2026-09-01 it was worse: db/database.py
# also selected JSONB_TYPE from that URL at import time, so the modules under test
# quietly bound generic JSON. JSONB_TYPE is now a compile-time variant, so the URL
# no longer decides the column type — but it still decides whether anything RUNS.)
# That silent-skip is the only way this gate can lie, so: the preflight step
# asserts the URL took effect, and the assertion step requires zero skips AND at
# least one executed test per discovered gate module — `tests > 0` alone is not
# enough, because the SQLite ride-along below satisfies it on its own.
#
# ── AND ITS MIRROR — FIXED 2026-09-01, kept here as the reason for the shape ───
# The same import-time selection USED TO run the OTHER way here. Because
# DATABASE_URL is Postgres for this whole job, db/database.py took its
# `if IS_POSTGRES:` branch and never registered the JSONB->JSON sqlite compiler
# shim, so any test building its own SQLite fixture BROKE under this env:
#   tests/test_pdp_content_depth.py, sqlite : 38 passed
#   tests/test_pdp_content_depth.py, here   :  3 passed, 35 errors
#     CompileError: SQLiteTypeCompiler can't render element of type JSONB
# db/database.py now declares `JSONB_TYPE = JSON().with_variant(JSONB,
# "postgresql")` and registers the sqlite shims UNCONDITIONALLY, so the type is
# chosen by the dialect doing the compiling rather than by DATABASE_URL. Both
# lines above now read 38 passed (measured on PG 15).
# Adding a SQLite-fixture suite to the ride-along list therefore no longer trips
# on JSONB/UUID/ARRAY. Still check a new suite under a Postgres URL before adding
# it — this class of breakage is fixed, not every possible one.
#
# ── ADDING A GATE FILE ─────────────────────────────────────────────────────────
# Name it `tests/test_<something>_postgres.py` and it is picked up automatically.
# Note the naming split, which is load-bearing:
#   tests/test_*_postgres.py             -> dialect gates. Empty DB, run here.
#   tests/test_*_postgres_integration.py -> heavier, need real data. NOT run here.
# It lands in the shard its path hashes to (see SHARDED below), next to whichever
# files share that shard's database. Verify locally against a fresh database with
# that shard's whole file list, not the file alone:
#   python scripts/postgres_dialect_gate_shards.py plan --num-shards 3 --shard K \
#     --ride-along-shard 2 --ride-alongs "<RIDE_ALONGS>" --manifest /tmp/k.json

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      # Deliberately broad. The #1588 defect was one expression in one service,
      # and a narrow path filter is how it would have skipped this gate. Anything
      # that can end up inside a SQL statement belongs here.
      - "routes/**"
      - "services/**"
      - "db/**"
      - "models/**"
      - "main.py"
      # scripts/ carry SQL that the postgres tests execute for real —
      # backfill_pdp_scope and onboard_external_brand_from_crawl now build their
      # seller-count SQL with `.format()` at call time, so a stray literal brace
      # added in a scripts-only PR would raise at runtime. The sweep workflow
      # triggers on scripts/** but runs with --ignore-glob='tests/test_*_postgres.py',
      # so WITHOUT this entry no pre-merge job executes those statements at all
      # (found by the #1676 review). The narrow-filter warning above, again.
      - "scripts/**"
      # middleware/** — added 2026-08-11, the narrow-filter warning a third time.
      # Two independent reasons:
      #   1. Middleware DOES carry SQL. middleware/usage_logger.py INSERTs into
      #      agent_usage_logs on the way out of every agent request, so a stray
      #      bind parameter or literal brace there is exactly the #1588 defect
      #      class in a directory this filter did not cover.
      #   2. Middleware sits in front of every route this job executes. #1727
      #      changed rate-limit enforcement for all of /agent/* and this gate did
      #      not run on it — the one job that executes real routes skipped the
      #      change most able to stop a real route from being reached at all.
      - "middleware/**"
      # config/ SUPPLIES database_url — i.e. this gate's own premise — and
      # utils/ is on the gated route's import path. Both were missing on the
      # first cut, which is the narrow-filter mistake this comment warns about,
      # made in the same file.
      - "config/**"
      - "utils/**"
      # tests/test_repo_sql_prepare_postgres.py PREPAREs every SQL literal under
      # these too. They were missing while the gate only executed routes, so a
      # bad statement added in a jobs-only or adapters-only PR would not have
      # triggered the job that plans it. The narrow-filter warning above, a third
      # time — the filter has to cover everything the gate READS, not just
      # everything it used to run.
      - "jobs/**"
      - "adapters/**"
      - "orchestrator/**"
      - "core/**"
      - "db/migrations/**"
      - "tests/test_*_postgres.py"
      # The subprocess entrypoint one stamping-backfill gate test runs `main()` through. It
      # carries no `test_` prefix (pytest must not collect it), so the glob above misses it,
      # and a PR touching only this file would not run the one test that executes it. The
      # narrow-filter warning above, once more.
      - "tests/backfill_variant_id_provenance_stamps_fault_driver.py"
      # Same reason, for the Reap cart-link lane. Every case its Postgres gate runs lives in a
      # shared, non-`test_` module that tests/test_reap_agentic_cart_link_postgres.py collects
      # by `import *`, and that module imports the validator's accept/refuse table from
      # tests/test_reap_cart_link.py, which the `_postgres` glob does not match either. A PR
      # touching only one of these would otherwise skip the gate that runs them on Postgres.
      - "tests/reap_cart_link_cases.py"
      - "tests/test_reap_cart_link.py"
      - "tests/integration/test_recovery_postgres.py"
      # The two files that can neuter this ENTIRE job, neither matched above.
      # tests/conftest.py pins DATABASE_URL — today conditionally, but making
      # that unconditional turns every gate file's `pytestmark` into a skip,
      # which is verbatim THE ONE GOTCHA in the header. pytest.ini supplies
      # `asyncio_mode = auto`, which the ride-along suites depend on. A PR
      # touching only those files would not run the job it just disarmed.
      - "tests/conftest.py"
      - "pytest.ini"
      # The compile-shape ride-along is not matched by the glob above, so it
      # needs its own entry or a change to it would not run its own gate.
      - "tests/test_pdp_renderability.py"
      - "tests/test_databases_textclause_params.py"
      # Same reason, third ride-along: without its own entry, a PR touching only
      # this file would not run the job that gives it its Postgres arm — and the
      # Postgres arm is the half that tests the statements which actually ship.
      - "tests/test_quality_backfill_partial_update.py"
      - "tests/test_quality_backfill_enqueue_dedupe.py"
      # tests/test_tierb_cart_link_eligibility_postgres.py IMPORTS its database cases from these
      # two (so the storage rules and the mocked end-to-end job run on Postgres). Neither matches
      # the `_postgres` glob, so a PR touching only them would not run the gate that runs them.
      - "tests/test_tierb_cart_link_eligibility.py"
      - "tests/test_tierb_cart_link_eligibility_job.py"
      # tests/test_retailer_ingest_weekly_reenqueue_postgres.py runs the REAL drain stage through fixtures and
      # helpers it imports from these four; none matches the `_postgres` glob, same reason as above.
      - "tests/services/test_retailer_ingest_weekly_reenqueue_producer.py"
      - "tests/services/test_retailer_ingest_markets_sg.py"
      - "tests/services/test_retailer_ingest_markets_phase2.py"
      - "tests/services/test_retailer_ingest_pipeline.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/postgres-dialect-gate.yml"

# Cancel a SUPERSEDED run on a PR branch only. On main every push is a merge commit whose
# gate result deploy-prod REQUIRES on that exact SHA (`require a green test sweep`): keying
# the group on `github.ref` made two merges inside one gate window cancel the first commit's
# gate, and deploy-prod then refused that deploy as "cancelled before it reached a verdict" --
# #2115 (cancelled by #2112, 2026-09-07) and #2118 (cancelled by #2123 nine seconds later,
# 2026-09-08), both green changes. Same key the Backend Test Sweep already uses: a PR number
# on pull_request, the run id on push, so main runs never share a group.
concurrency:
  group: postgres-dialect-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# ── SHARDED SINCE 2026-10-13 ───────────────────────────────────────────────────
# One pytest process ran every file below in 21-23 min against a 25-min ceiling, and
# #2577's first run was cancelled at 98% with every test passing (run 38322789427:
# pytest still running at 24m30s; its re-run on the same commit took 21m02s). Measured
# from that run's JUnit: 4,814 tests in 185 files, 1,286 s of test time, ~45 s of
# collection, ~35 s of containers + checkout + install. No file is over 6% of it, so
# there was no fixture to cut — the work is split instead.
#
# `shard` runs as a matrix; each shard has its OWN Postgres service and runs the
# files that `sha256(path) mod N` assigns it, in their unsharded relative order,
# against ONE database. That is the same premise as before — every file in a shard
# shares that shard's database and meets whatever earlier files left there — over a
# subset of the files. The four ride-alongs and the recovery report all run in
# RIDE_ALONG_SHARD, so test_quality_backfill_partial_update.py still runs last in
# its process. scripts/postgres_dialect_gate_shards.py says why files (not tests)
# are hashed and why by path rather than by position.
#
# Two names are load-bearing and must not change:
#   * the workflow `name:` "Postgres Dialect Gate" — deploy-prod.yml's test-gate finds
#     this workflow's push run on the SHA by that exact string;
#   * the final job's name "execute real routes on real Postgres". It runs after every
#     shard, fails when any shard failed, timed out or never reported, and re-proves
#     the shards add up to one complete run with zero skips.
# CI Entrypoint expands the single-key static matrix into
# `execute real routes on real Postgres shard (1)` .. `(N)` and requires each of them
# as well as the final job; keep the matrix a literal list for that reason (a
# `fromJSON` matrix is not statically expandable, so it would go unenforced).
#
# DIALECT_GATE_SHARDS must equal the length of the matrix;
# tests/test_postgres_dialect_gate_shards.py pins it. Three, sized from the run above:
# hashing those 185 files three ways puts 389 / 362+61 / 475 s of test time in the
# shards (ride-alongs in shard 2), ~8 min of pytest for the largest, ~9-10 min a shard.
env:
  DIALECT_GATE_SHARDS: 3
  RIDE_ALONG_SHARD: 2
  # The compile-shape guards ride along. They are SQLite-safe and cost
  # under a second, and they are the other half of this story: a compiled
  # SQL string can be malformed in ways only a shape assertion catches
  # cheaply, and nothing else in CI runs them today either.
  #
  # test_databases_textclause_params.py rides along for the same reason,
  # and was checked SQLite-safe under this job's Postgres URL per the
  # header warning. It carries a repo-wide AST guard against
  # `database.<method>(text(...), params)`, which `databases` 0.7.0 turns
  # into an unconditional AttributeError (TextClause has no `.values()`).
  # That call shape is only reachable from routes/services/db — exactly
  # this job's path filter — and both known occurrences sat inside
  # `except Exception`, so the symptom was a silent wrong answer rather
  # than a 500 that CI or logs would ever surface.
  # test_quality_backfill_partial_update.py rides along because it is the
  # only thing that executes db/product_quality_backfill_jobs.py's raw
  # UPDATEs, and the half that ships is the Postgres half. Its statements
  # are a dialect split -- `CAST(:errors_sample AS JSONB)` on Postgres, a
  # bare bind on SQLite -- so running it only in backend-test-sweep (which
  # sets no DATABASE_URL, hence SQLite) exercises the twin and never the
  # production text. Demonstrated: reintroducing the "a None counter
  # overwrites a live value" defect in the POSTGRES constant alone left
  # the sweep, the -k "quality or backfill" selection AND this job's own
  # PREPARE sweep all green -- PREPARE plans `SET x = $1` happily, and the
  # SQLite twin is untouched. Renaming it to *_postgres.py is the wrong
  # fix: backend-test-sweep --ignore-glob's that pattern, so it would swap
  # the Postgres gap for a SQLite one, and the split needs BOTH sides.
  # Checked SQLite-safe under this job's Postgres URL, against a jsonb
  # column and a model-first json one. It DOES declare two skips now
  # (`skipif(not IS_POSTGRES)`, on cases about asyncpg's datetime
  # encoding), inert here because IS_POSTGRES is true — the preflight
  # asserts that — so the zero-skip check below still holds.
  # KEEP test_quality_backfill_partial_update.py LAST: one of its cases
  # ALTERs the timestamp columns of product_quality_backfill_jobs and
  # restores them, so a ride-along added after it would run while that
  # switch is in flight. test_quality_backfill_enqueue_dedupe.py rides
  # along for the same reason it exists: the cooldown lookup has a
  # Postgres twin that is different text from the SQLite one, and its
  # time-zone cases can only fail here.
  #
  # Space-separated, in run order. All of them run in RIDE_ALONG_SHARD, after that
  # shard's gate files, in this order; a listed file that does not exist is dropped,
  # as the unsharded `[ -e "$f" ]` loop did.
  RIDE_ALONGS: >-
    tests/test_pdp_renderability.py
    tests/test_databases_textclause_params.py
    tests/test_quality_backfill_enqueue_dedupe.py
    tests/test_quality_backfill_partial_update.py

jobs:
  shard:
    name: execute real routes on real Postgres shard
    runs-on: ubuntu-latest
    # 25 is ~2.5x a shard's expected ~9-10 min. The unsharded job had 25 against 21-23
    # min runs, and before that 15 against 14-15 (#2422/#2423 cancelled at 74% with
    # every test passing, 2026-09-28): a cancelled gate is a red gate for a reason
    # unrelated to the code. 25 here plus 5 for the final job is this workflow's
    # 30-minute critical path, inside deploy-prod's and CI Entrypoint's 50-minute
    # deadlines (tests/test_deploy_prod_gates_on_the_test_sweep.py sums it).
    timeout-minutes: 25
    strategy:
      # Every shard runs to its end even when another fails: the final job needs all
      # of their results to say what failed, and a cancelled sibling looks like a
      # missing shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pivota_dialect_check
        ports:
          - 5432:5432
        # Without this the first connection races the container's own init.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Set at JOB level, not step level, so it is in the environment before
      # pytest imports anything — see THE ONE GOTCHA above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pivota_dialect_check
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Preflight — prove the Postgres URL actually took effect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys

          url = (os.getenv("DATABASE_URL") or "").strip()
          if not url.startswith(("postgresql://", "postgres://")):
              sys.exit(f"DATABASE_URL is not a Postgres URL: {url!r}")

          # What the modules under test will actually EMIT. If this rendered plain
          # JSON, every module under test would be bound to the wrong type and the
          # gate would prove nothing — precisely the state that let #1588 through,
          # so fail here rather than pass a green run that tested SQLite semantics
          # against a Postgres URL.
          #
          # This was an IDENTITY check (`JSONB_TYPE is JSONB`) while JSONB_TYPE was
          # selected from DATABASE_URL at import time. It is now a compile-time
          # variant, so identity is the wrong question — compile it and look. That
          # is strictly stronger: it asserts the behaviour this gate depends on
          # rather than the object that used to produce it.
          from db.database import IS_POSTGRES, JSONB_TYPE
          from sqlalchemy.dialects import postgresql, sqlite

          if not IS_POSTGRES:
              sys.exit("db.database.IS_POSTGRES is False — the URL did not take effect")

          pg_ddl = JSONB_TYPE.compile(dialect=postgresql.dialect()).strip()
          if pg_ddl.upper() != "JSONB":
              sys.exit(f"JSONB_TYPE compiles to {pg_ddl!r} on postgresql, expected JSONB")

          # The mirror, and the whole reason the variant exists: a Postgres
          # DATABASE_URL must no longer break a suite that builds its own SQLite
          # fixture. See "AND ITS MIRROR" in the header.
          sqlite_ddl = JSONB_TYPE.compile(dialect=sqlite.dialect()).strip()
          if sqlite_ddl.upper() != "JSON":
              sys.exit(f"JSONB_TYPE compiles to {sqlite_ddl!r} on sqlite, expected JSON")

          print(f"preflight ok: IS_POSTGRES=True, JSONB_TYPE -> {pg_ddl} (pg) / {sqlite_ddl} (sqlite)")
          PY

      - name: Discover this shard's gate files
        id: discover
        shell: bash
        # Through `env:`, NOT interpolated into the script — see the run step below.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # `tests/test_*_postgres.py` only, hashed to shards by path; the ride-alongs
          # (workflow `env:` above) are appended in RIDE_ALONG_SHARD. Writes `files`,
          # `gate_modules` (bare module names, for the coverage assertion below, which
          # matches junit `classname` attributes) and this shard's manifest, which the
          # final job checks against its own plan of the same checkout.
          python scripts/postgres_dialect_gate_shards.py plan \
            --num-shards "${DIALECT_GATE_SHARDS}" --shard "${SHARD}" \
            --ride-along-shard "${RIDE_ALONG_SHARD}" --ride-alongs "${RIDE_ALONGS}" \
            --manifest "shard-${SHARD}.manifest.json"

      - name: Execute the routes on Postgres
        id: run_gate
        shell: bash
        # Through `env:`, NOT interpolated straight into the script. `${{ }}` in a
        # `run:` body is textual substitution before the shell ever sees it, so a
        # file named `test_a;id;b_postgres.py` would EXECUTE `id`. Demonstrated,
        # not theorised. Bounded here (pull_request, no secrets in this job) but
        # it is the textbook pattern and costs one line to not have.
        env:
          GATE_FILES: ${{ steps.discover.outputs.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # `--durations=25` prints the slowest setups/calls into this shard's log, so
          # the next "where does the time go" starts from the log, not a re-measure.
          # shellcheck disable=SC2086  # word-splitting is intended: this is a file list
          pytest -q -p no:cacheprovider --durations=25 \
            --junitxml="pytest-postgres-shard-${SHARD}.xml" \
            $GATE_FILES

      - name: Assert the gate actually gated
        # Runs even when pytest failed, because a skipped run exits 0 and must
        # still turn the job red. Skipped when the job is cancelled or when the
        # run step never happened — otherwise an Install/Preflight failure would
        # be masked by "could not read pytest-postgres-shard-N.xml".
        if: ${{ !cancelled() && steps.run_gate.conclusion != 'skipped' }}
        shell: bash
        env:
          GATE_MODULES: ${{ steps.discover.outputs.gate_modules }}
          JUNIT: pytest-postgres-shard-${{ matrix.shard }}.xml
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          junit = os.environ["JUNIT"]
          try:
              root = ET.parse(junit).getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"could not read {junit}: {exc}")

          suites = root.findall("testsuite") or ([root] if root.tag == "testsuite" else [])
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped}")

          if tests == 0:
              sys.exit("pytest collected 0 tests — the gate ran nothing")
          if skipped:
              sys.exit(
                  f"{skipped} test(s) SKIPPED. The gate files skip themselves when "
                  "DATABASE_URL is not a Postgres URL, so a skip here means this job "
                  "is green while testing nothing."
              )

          # PER-MODULE COVERAGE. `tests > 0` is NOT sufficient and it is worth
          # saying why: the SQLite compile-shape ride-along contributes ~50 of the
          # ~51 tests here, so deleting every test function out of the Postgres
          # gate file leaves this step green with tests=50, skipped=0 and ZERO
          # statements executed against Postgres. Demonstrated, not theorised.
          # Require each of this shard's gate modules to have executed at least
          # one test of its own. The final job repeats this across all shards.
          modules = [m for m in (os.getenv("GATE_MODULES") or "").split() if m]
          if not modules:
              sys.exit("GATE_MODULES is empty — the discover step produced no gate modules")

          ran = set()
          for case in root.iter("testcase"):
              classname = case.get("classname") or ""
              filename = case.get("file") or ""
              for module in modules:
                  if module in classname or module in filename:
                      ran.add(module)

          missing = [m for m in modules if m not in ran]
          if missing:
              sys.exit(
                  "these gate modules executed no tests: "
                  + ", ".join(missing)
                  + ". The gate is green without having run anything against Postgres."
              )
          print(f"gate modules executed: {', '.join(sorted(ran))}")
          PY

      # AFTER the gate steps, deliberately. This step creates its own
      # database and runs its own pytest; when it sat before the
      # preflight/discover/execute/assert chain, a failure in it aborted
      # the job before the gate those four steps exist to enforce had run
      # at all — a red build that proves nothing about the dialect gate,
      # and one whose message points somewhere else entirely. It keeps its
      # own junit assertion (a skipped recovery test is still a failure).
      # ONE shard runs it (RIDE_ALONG_SHARD); the final job fails if that shard has
      # no recovery JUnit, so a wrong `if:` here cannot make it silently vanish.
      - name: Recovery report JSONB to authenticated HTTP
        if: ${{ matrix.shard == fromJSON(env.RIDE_ALONG_SHARD) }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PYDB'
          import asyncio
          import asyncpg
          async def create_test_database():
              connection = await asyncpg.connect(
                  host="localhost", port=5432, user="postgres",
                  password="postgres", database="postgres")
              try:
                  await connection.execute("CREATE DATABASE recovery_contract_test")
              finally:
                  await connection.close()
          asyncio.run(create_test_database())
          PYDB
          RUN_RECOVERY_POSTGRES=1 \
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/recovery_contract_test \
            python -m pytest tests/integration/test_recovery_postgres.py -q \
              --junitxml="pytest-recovery-postgres-shard-${SHARD}.xml"
          RECOVERY_JUNIT="pytest-recovery-postgres-shard-${SHARD}.xml" python - <<'PYTEST'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ["RECOVERY_JUNIT"]).getroot().iter("testcase"))
          assert cases and not any(c.find("skipped") is not None for c in cases), "Recovery PostgreSQL test did not execute"
          PYTEST

      # Uploaded on failure too: the final job reports a red shard's counts.
      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dialect-gate-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.manifest.json
            pytest-postgres-shard-${{ matrix.shard }}.xml
            pytest-recovery-postgres-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          # A `rerun --failed` re-uploads under the same name in the same run.
          overwrite: true
          retention-days: 14

  postgres-dialect-gate:
    name: execute real routes on real Postgres
    needs: shard
    # `!cancelled()`, not `always()`: this job must run when a shard FAILED or hit its
    # own timeout (that is a cancelled JOB, not a cancelled workflow), so the failure is
    # reported here by shard, but not when the whole run was superseded by a newer push
    # to the same PR. Without an `if:` at all a red shard would leave this job SKIPPED,
    # and CI Entrypoint tolerates a skipped job.
    if: '!cancelled()'
    runs-on: ubuntu-latest
    # Download and verify take seconds; nothing is installed.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the shards' results
        uses: actions/download-artifact@v4
        with:
          pattern: postgres-dialect-gate-${{ github.run_id }}-shard-*
          path: shards

      # FAILS unless the shards add up to exactly one gate run: every shard job
      # succeeded and reported; each ran exactly the files this checkout plans for it;
      # together they ran every gate file and ride-along once; zero skips anywhere;
      # every gate module executed a test; the recovery report ran in its shard.
      - name: Prove the shards are one complete run
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          python scripts/postgres_dialect_gate_shards.py verify \
            --shards-dir shards --num-shards "${DIALECT_GATE_SHARDS}" \
            --ride-along-shard "${RIDE_ALONG_SHARD}" --ride-alongs "${RIDE_ALONGS}" \
            --recovery-shard "${RIDE_ALONG_SHARD}" --needs-result "${SHARD_RESULT}"
