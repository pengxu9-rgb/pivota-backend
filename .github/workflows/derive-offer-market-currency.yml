name: Derive Offer Market/Currency from Storefront

# Corrects external-seed offers whose market/currency was stamped from the ingest
# default instead of the store's real values (Shopify /meta.json). Correct-only and
# never-fabricate (see scripts/backfill_offer_market_currency.py), so the weekly
# run self-heals new mispriced ingest. Manual dispatch defaults to a dry-run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write corrections (false = dry-run report only)"
        required: true
        default: false
        type: boolean
      min_offers:
        description: "Only consider domains with at least this many live offers"
        required: true
        default: "3"
        type: string
  schedule:
    # Weekly, Monday 09:11 UTC. Auto-applies: the whole point is self-healing new
    # mispriced ingest. The corrector is conservative (writes only when the store's
    # real currency is KNOWN and DIFFERS). Change the apply flag below to gate it.
    - cron: "11 9 * * 1"

concurrency:
  group: derive-offer-market-currency
  cancel-in-progress: false

jobs:
  derive-offer-market-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Derive market/currency
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          # scheduled runs apply (self-heal); manual runs honor the apply input.
          apply_flag=""
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.apply }}" == "true" ]]; then
            apply_flag="--apply"
          fi
          min_offers="${{ inputs.min_offers || '3' }}"
          out_dir="reports/workflow_ops/derive-offer-market-currency/${{ github.run_id }}"
          mkdir -p "${out_dir}"
          python -m scripts.backfill_offer_market_currency \
            --min-offers "${min_offers}" ${apply_flag} \
            | tee "${out_dir}/run.log"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: derive-offer-market-currency-${{ github.run_id }}
          path: reports/workflow_ops/derive-offer-market-currency/
          if-no-files-found: ignore
