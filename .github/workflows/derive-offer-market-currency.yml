name: Derive Offer Market/Currency from Storefront

# Corrects external-seed offers whose market/currency was stamped from the ingest
# default instead of the store's real values (Shopify /meta.json). Correct-only and
# never-fabricate (see scripts/backfill_offer_market_currency.py), so the weekly
# run self-heals new mispriced ingest. Manual dispatch defaults to a dry-run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write corrections (false = dry-run report only)"
        required: true
        default: false
        type: boolean
      min_offers:
        description: "Only consider domains with at least this many offers"
        required: true
        default: "3"
        type: string
      only_domains:
        description: "Comma-separated domains to restrict the WRITES to (blank = all classified). Use this to apply a reviewed subset."
        required: false
        default: ""
        type: string
      max_domains:
        description: "Refuse --apply if more than this many domains would be relabelled (0 = off)"
        required: true
        default: "25"
        type: string
      live_only:
        description: "Skip suppressed offers (pre-2026-07-27 scope). Leaves rows suppressed FOR a currency defect permanently mislabelled."
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, Monday 09:11 UTC. DRY-RUN ONLY — detects drift (new mispriced-ingest
    # domains) and uploads the report; it never writes. base-currency != a US
    # Markets buyer's price, so a human reviews the by-domain report and runs the
    # workflow_dispatch with apply=true for any writes.
    - cron: "11 9 * * 1"

concurrency:
  group: derive-offer-market-currency
  cancel-in-progress: false

jobs:
  derive-offer-market-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Derive market/currency
        shell: bash
        # EVERY `${{ }}` value arrives through `env:`, NEVER interpolated into the
        # script body. `${{ }}` in a `run:` is textual substitution performed
        # BEFORE the shell parses anything, so an input of `"; echo PWNED; :; "`
        # renders as executable shell — and this job's env carries the PRODUCTION
        # `DATABASE_URL`. Demonstrated on this workflow, not theorised: the
        # `only_domains`, `max_domains` and `min_offers` inputs all had it.
        # `.github/workflows/postgres-dialect-gate.yml` already spells this rule
        # out; it just had not been applied here.
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_APPLY: ${{ inputs.apply }}
          IN_LIVE_ONLY: ${{ inputs.live_only }}
          IN_MIN_OFFERS: ${{ inputs.min_offers }}
          IN_MAX_DOMAINS: ${{ inputs.max_domains }}
          IN_ONLY_DOMAINS: ${{ inputs.only_domains }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          # scheduled runs are dry-run ONLY (detect drift); writes require an
          # explicit workflow_dispatch with apply=true.
          apply_flag=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${IN_APPLY:-}" == "true" ]]; then
            apply_flag="--apply"
          fi
          live_only_flag=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${IN_LIVE_ONLY:-}" == "true" ]]; then
            live_only_flag="--live-only"
          fi
          min_offers="${IN_MIN_OFFERS:-3}"
          max_domains="${IN_MAX_DOMAINS:-25}"
          # --only-domain is repeatable; expand the comma-separated input into one
          # flag per domain. Built as an array so a stray space cannot word-split
          # a domain into two bogus flags, and so an empty input expands to ZERO
          # args rather than one empty one.
          only_args=()
          only_raw="${IN_ONLY_DOMAINS:-}"
          if [[ -n "${only_raw}" ]]; then
            IFS=',' read -ra _only <<< "${only_raw}"
            for d in "${_only[@]}"; do
              d="$(echo "${d}" | tr -d '[:space:]')"
              [[ -n "${d}" ]] && only_args+=(--only-domain "${d}")
            done
          fi
          out_dir="reports/workflow_ops/derive-offer-market-currency/${RUN_ID}"
          mkdir -p "${out_dir}"
          python -m scripts.backfill_offer_market_currency \
            --min-offers "${min_offers}" --max-domains "${max_domains}" \
            ${live_only_flag} "${only_args[@]+"${only_args[@]}"}" ${apply_flag} \
            | tee "${out_dir}/run.log"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: derive-offer-market-currency-${{ github.run_id }}
          path: reports/workflow_ops/derive-offer-market-currency/
          if-no-files-found: ignore
