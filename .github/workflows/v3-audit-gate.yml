name: V3 Audit Gate

# Structural gate for the v3 merchant-audit path.
#
# Why this exists: unit tests passed while the v3 worker was silently falling
# back to the legacy report on prod (a JSONB column wasn't decoded to a dict on
# read, so the per-SKU branch never executed — fixed in PR #706). A
# pilot-readiness review caught it; unit tests did not. This gate runs the
# end-to-end integration test on every change to the audit path so the same
# class of "v3 silently degrades to legacy" regression is caught BEFORE merge,
# not after.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - "routes/audit_runs_routes.py"
      - "services/audit_run_worker.py"
      - "services/agent_center_bd_report_service.py"
      - "services/brand_alias.py"
      - "services/merchant_credit_balance_service.py"
      - "services/catalog_sync_service.py"
      - "services/audit_scheduler.py"
      - "routes/merchant_store_connections.py"
      - "services/merchant_audit_readiness.py"
      - "db/merchant_audit_runs.py"
      - "routes/merchant_audit_routes.py"
      - "services/bd_cold_start_service.py"
      - "services/sku_opportunity.py"
      - "services/buyer_path_stable_controllers.py"
      # Multi-vertical audit spine (Phase 0-2): the resolver + profiles, the
      # vertical-aware brief, and the LLM attribute extractor all shape audit
      # output — gate them so a change can't skip the v3 end-to-end run.
      - "services/vertical_profiles.py"
      # Phase 1c: host role/tier classification (authority + retailer wiring)
      # feeds source_roles, authority_map, and the outreach targets — a
      # classifier change must not skip the v3 end-to-end run.
      - "services/cited_host_classifier.py"
      - "services/strategic_brief.py"
      - "services/llm_attribute_extractor.py"
      - "services/competitor_brand_filter.py"
      - "services/audit_invariants.py"
      - "services/audit_review_gate.py"
      - "db/llm_probe_runs.py"
      - "tests/integration/test_audit_v3_end_to_end.py"
      - "tests/services/test_agent_center_bd_per_sku.py"
      - "tests/services/test_merchant_credit_balance_service.py"
      - "tests/services/test_audit_v3_resolver_sku_key.py"
      - "tests/services/test_audit_v3_probe_runs_jsonb_decode.py"
      - "tests/services/test_audit_v3_prompt_identity.py"
      - "tests/services/test_audit_v3_probe_fanout_resilience.py"
      - "tests/services/test_audit_v3_first_party_and_band.py"
      - "tests/services/test_audit_v3_citation_strict_sku_mention.py"
      - "tests/services/test_audit_v3_identity_resolution.py"
      - "tests/services/test_audit_v3_identity_robust_citation.py"
      - "tests/services/test_audit_v3_onboarding_quality_autodrain.py"
      - "tests/services/test_audit_v3_merchant_sync_ingests_catalog.py"
      - "tests/services/test_audit_v3_full_data_band.py"
      - "tests/services/test_audit_v3_readiness_probe.py"
      - "tests/services/test_audit_v3_url_wedge.py"
      - "tests/services/test_curated_audit_fetch.py"
      - "tests/services/test_brand_alias.py"
      - "tests/services/test_audit_v3_brand_alias.py"
      - "tests/services/test_audit_v3_product_concurrency.py"
      - "tests/test_audit_invariants.py"
      - ".github/workflows/v3-audit-gate.yml"

jobs:
  v3-audit-e2e:
    name: v3 audit end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The e2e test is self-contained (in-memory store, all DB/LLM calls
      # monkeypatched). DATABASE_URL is set only so module import doesn't fail
      # building an engine; no live DB is contacted.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run v3 audit end-to-end gate
        run: |
          pytest -q \
            tests/integration/test_audit_v3_end_to_end.py \
            tests/services/test_agent_center_bd_per_sku.py \
            tests/services/test_merchant_credit_balance_service.py \
            tests/services/test_audit_v3_resolver_sku_key.py \
            tests/services/test_audit_v3_probe_runs_jsonb_decode.py \
            tests/services/test_audit_v3_prompt_identity.py \
            tests/services/test_audit_v3_probe_fanout_resilience.py \
            tests/services/test_audit_v3_first_party_and_band.py \
            tests/services/test_audit_v3_citation_strict_sku_mention.py \
            tests/services/test_audit_v3_identity_resolution.py \
            tests/services/test_audit_v3_identity_robust_citation.py \
            tests/services/test_audit_v3_onboarding_quality_autodrain.py \
            tests/services/test_audit_v3_merchant_sync_ingests_catalog.py \
            tests/services/test_audit_v3_full_data_band.py \
            tests/services/test_audit_v3_readiness_probe.py \
            tests/services/test_audit_v3_url_wedge.py \
            tests/services/test_curated_audit_fetch.py \
            tests/services/test_brand_alias.py \
            tests/services/test_audit_v3_brand_alias.py \
            tests/services/test_audit_v3_product_concurrency.py \
            tests/services/test_audit_v3_sku_ref_resolution.py \
            tests/services/test_audit_v3_readiness_gate.py \
            tests/test_audit_invariants.py \
            tests/services/test_intake_identity.py \
            tests/services/test_intake_identity_doors.py \
            tests/test_catalog_products_writer_tripwire.py
