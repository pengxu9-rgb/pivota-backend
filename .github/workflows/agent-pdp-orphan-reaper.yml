name: Agent PDP Orphan Reaper

# Periodic backstop for services.agent_pdp_view_assembler.reap_orphaned_agent_pdp_view_rows.
#
# The inline reap in catalog_sync (delete_agent_pdp_view_if_orphaned) clears the
# common re-key case at ingest time. This sweep is the catch-all for every OTHER
# re-key site and the safety net if an inline reap was skipped (best-effort) — it
# deletes agent_pdp_view rows whose content_key no longer exists in
# catalog_products. Safe + idempotent: the delete re-checks NOT EXISTS, so a live
# or shared content_key is never removed. On a clean DB this is a no-op.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete orphans (unchecked = dry-run report only)"
        required: true
        default: false
        type: boolean
      limit:
        description: "Max orphans to process (0 = all)"
        required: true
        default: "0"
        type: string
  schedule:
    # Daily 04:37 UTC — off-peak, offset from the PDP production smoke (08:17).
    - cron: "37 4 * * *"

jobs:
  agent-pdp-orphan-reaper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reap orphans (dry-run report)
        shell: bash
        # `${{ }}` in a `run:` body is TEXTUAL SUBSTITUTION performed before the
        # shell parses anything, so a free-form input lands as executable shell in
        # a job holding the production DATABASE_URL. Values arrive through `env:`.
        env:
          RUN_ID: ${{ github.run_id }}
          REAP_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          out_dir="reports/workflow_ops/agent-pdp-orphan-reaper/${RUN_ID}"
          mkdir -p "${out_dir}"
          python -m scripts.reap_orphaned_agent_pdp_view \
            --limit "${REAP_LIMIT}" \
            | tee "${out_dir}/dry_run.json"

      - name: Reap orphans (apply)
        # Scheduled runs auto-apply (that is the backstop). Manual runs apply only
        # when the apply box is checked.
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          REAP_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
        run: |
          set -euo pipefail
          out_dir="reports/workflow_ops/agent-pdp-orphan-reaper/${RUN_ID}"
          mkdir -p "${out_dir}"
          python -m scripts.reap_orphaned_agent_pdp_view \
            --apply \
            --limit "${REAP_LIMIT}" \
            | tee "${out_dir}/apply.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-pdp-orphan-reaper-${{ github.run_id }}
          path: reports/workflow_ops/agent-pdp-orphan-reaper/${{ github.run_id }}
          retention-days: 14
