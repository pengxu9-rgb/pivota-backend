name: ADR-009 Orphan Recon

# On-demand READ-ONLY reconnaissance of the sentinel residue the verifier
# reports on ownership tables after the flip (scripts/recon_sentinel_orphans.py).
# Prints one JSON document; writes nothing. Same runner channel as the verify
# workflow, for the same reason: GitHub's runners reach the database reliably
# while the Railway proxy / ssh edge degrade for hours at a time.

on:
  workflow_dispatch:
    inputs:
      also_history:
        description: "history-bucket tables to classify too (comma-separated)"
        required: false
        default: "pdp_identity_listing,product_enrichment"
      sample:
        description: "sample rows per table"
        required: false
        default: "5"

jobs:
  orphan-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recon (read-only; prints JSON)
        run: >
          python -m scripts.recon_sentinel_orphans
          --also-history "${{ github.event.inputs.also_history }}"
          --sample "${{ github.event.inputs.sample }}"
