############################
# Default Records (optional)
############################

# v0.1 default return policy bundle:
# - return_window_days=30
# - refund_sla_days=5
# - refund_trigger=on_receive
mutation PCSDefault_ReturnPolicyBundle {
  metaobjectCreate(
    metaobject: {
      type: "pcs_return_policy_bundle"
      fields: [
        { key: "schema_version", value: "0.1" }
        { key: "window_days", value: "30" }
        { key: "refund_sla_days", value: "5" }
        { key: "refund_trigger", value: "on_receive" }
        { key: "restricted_regions_json", value: "[]" }
        { key: "effective_from", value: "2025-01-01T00:00:00Z" }
        { key: "source", value: "default_v0_1" }
      ]
    }
  ) { metaobject { id type handle } userErrors { field message } }
}

