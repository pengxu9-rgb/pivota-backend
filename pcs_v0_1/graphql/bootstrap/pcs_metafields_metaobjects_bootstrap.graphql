# PCS v0.1 bootstrap (Admin GraphQL)
# - Creates Metafield Definitions (namespace=pcs)
# - Creates Metaobject Definitions for versioned rulesets
#
# Notes:
# - Some ownerTypes/types may vary by API version; run in GraphiQL and adjust if Shopify returns userErrors.
# - For list types, Shopify uses e.g. "list.single_line_text_field".

############################
# Metafield Definitions
############################

mutation PCSMetafieldDef_Shop_ShipWithinHours {
  metafieldDefinitionCreate(
    definition: {
      name: "PCS Ship Within Hours"
      namespace: "pcs"
      key: "ship_within_hours"
      ownerType: SHOP
      type: "number_integer"
      pin: true
    }
  ) { createdDefinition { id } userErrors { field message } }
}

