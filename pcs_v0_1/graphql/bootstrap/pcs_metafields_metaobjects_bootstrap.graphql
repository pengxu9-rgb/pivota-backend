############################
# Metaobject Definitions (Versioned Rulesets)
############################

mutation PCSDefine_ReturnPolicyBundle {
  metaobjectDefinitionCreate(
    definition: {
      type: "pcs_return_policy_bundle"
      name: "PCS Return Policy Bundle"
      access: { storefront: PUBLIC_READ }
      fieldDefinitions: [
        { key: "schema_version", name: "Schema Version", type: "single_line_text_field", required: true }
        { key: "window_days", name: "Return Window Days", type: "number_integer", required: true }
        { key: "refund_sla_days", name: "Refund SLA Days", type: "number_integer", required: true }
        { key: "refund_trigger", name: "Refund Trigger", type: "single_line_text_field", required: true }
        { key: "restricted_regions_json", name: "Restricted Regions JSON", type: "json" }
        { key: "effective_from", name: "Effective From", type: "date_time", required: true }
        { key: "effective_to", name: "Effective To", type: "date_time" }
        { key: "source", name: "Source", type: "single_line_text_field" }
      ]
    }
  ) { metaobjectDefinition { id type } userErrors { field message } }
}

