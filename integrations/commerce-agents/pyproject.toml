[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pivota-storefront-backend"
version = "0.1.0.dev0"
description = "Pivota's multi-merchant index as a StorefrontBackend for anthropics/commerce-agents."
requires-python = ">=3.11"
dependencies = [
  # Installed from the blueprint repo; see README.
  "shopping-agent-core==0.1.0.dev0",
  "commerce-common==0.1.0.dev0",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["pivota_storefront"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
