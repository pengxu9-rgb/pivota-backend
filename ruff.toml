# Ruff — the repository had NO linter of any kind until 2026-09-10.
#
# WHY THIS EXISTS. `scripts/seed_category_taxonomy.py` shipped a `NameError` in a branch only
# reachable under `--apply`; `--dry-run` passed, no test imported the script, and a mutation sweep
# over that code "passed" because the code was already dead. It reached review and production
# review twice. A linter finds it in two seconds, and nothing in fourteen CI workflows ran one.
#
# The first run found 36 undefined names, 24 of them in production code — including
# `services/pdp_governance_service.py:2747` calling a function that has never existed in this
# repository, inside a `try/except` that logs "falling back to synthesized subject". It has been
# taking that fallback on every candidate merge since 2026-04-25.
#
# DELIBERATELY NARROW. This is a correctness gate, not a style gate: nobody needs a 1,200-file
# formatting diff today. Style rules can be added later; the point now is that a name which cannot
# resolve must not merge.

line-length = 120
exclude = [".venv", "venv", "node_modules", ".git", "__pycache__", "build", "dist", ".claude"]

[lint]
# Rules for "this file is broken", not for style.
#
# F821 undefined name                  — the class that shipped
# F404 late `from __future__` import   — SEE BELOW. Added after the first version of this PR
#                                        introduced seven of them and this linter passed.
# F822 undefined name in __all__
# F823 local referenced before assignment
# F702/F704/F706 continue/yield/return outside their construct
# E9   I/O errors reading a file
#
# ⚠️ E9 IS NOT WHAT CATCHES AN UNPARSEABLE FILE, and the first version of this file claimed it
# was. Ruff reports a genuine syntax error unconditionally, whatever is selected; E999 is not a
# selectable rule in 0.16. And a misplaced `__future__` import is not a parse error at all — ruff
# parses it happily. It is F404, which was not selected, which is how seven SyntaxErrors merged
# past the linter introduced to stop exactly that. The belt-and-braces is
# tests/test_every_python_file_compiles.py, which cannot be switched off from this file.
select = ["F821", "F404", "F822", "F823", "F702", "F704", "F706", "E9"]
# ⚠️ F811 (redefinition) IS NOT ON YET, and it is the highest-value thing to turn on next.
# 83 findings, and an earlier version of this comment described them wrongly as "almost all in
# tests". Measured: 75 in routes/, 3 in services/, 2 in main.py, 3 in tests/ — and ZERO redefined
# test functions. The real population is duplicate ROUTE HANDLERS: `fulfill_amazon_order` is
# defined twice in routes/admin_amazon_fulfillment.py (:78 and :559) on the same decorator path,
# and there are ~27 more. Starlette serves the first registration, so the second definition is
# dead production code that may have diverged from the one being served. Left off because 83
# fixes do not belong in the PR that introduces the linter, but this is where the bodies are.

[lint.per-file-ignores]
# ⚠️ A BASELINE, NOT AN EXEMPTION. Each of these is a REAL undefined name that needs a decision
# this linter PR is not the place to make, and each is one small PR. The count is asserted in
# tests/test_lint_baseline_only_shrinks.py so the list can only get shorter.
#
# routes/agent_shop_gateway.py:14461 — `http_request.state.traffic_taxonomy = ...` inside
#   `create_creator_task`, whose signature has no such parameter (it takes a pydantic body named
#   `request`). Wrapped in `except Exception: pass`, so traffic taxonomy has never been stamped on
#   this route. Fix = add `http_request: Request` to the signature; needs a route-behaviour check.
"routes/agent_shop_gateway.py" = ["F821"]
# services/pdp_governance_service.py:2747 — `_subject_from_product_key` is not defined anywhere in
#   the repository and never has been (since 0a08d8091, 2026-04-25). The sibling
#   `_subject_from_external_seed` exists at :1059. Whether the call should be re-pointed at it or
#   the function written is a product question about candidate merges.
"services/pdp_governance_service.py" = ["F821"]
