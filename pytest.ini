[pytest]
addopts = -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Pydantic V1 style `@validator` validators are deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:`json_encoders` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Please use `import python_multipart` instead.*:PendingDeprecationWarning
    ignore:The 'app' shortcut is now deprecated.*:DeprecationWarning
testpaths =
    tests
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
norecursedirs =
    .git
    .venv
markers =
    live_locale: exercises fetch_shopify_shop_locale itself; opts out of the offline autouse stub in tests/services/test_curated_brand_feed.py
