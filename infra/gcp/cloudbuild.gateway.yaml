# Build + push the PIVOTA-Agent gateway image. Run from a PIVOTA-Agent checkout:
#   gcloud builds submit --config <this file> --project pivota-shared \
#     --substitutions=COMMIT_SHA=$(git rev-parse HEAD) .
substitutions:
  _REGION: us-west1
  _REPO: pivota
  _IMAGE: gateway
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest',
           '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
