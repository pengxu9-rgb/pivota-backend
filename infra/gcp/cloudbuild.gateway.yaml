# Build + push the PIVOTA-Agent gateway image. Run from a PIVOTA-Agent checkout:
#   gcloud builds submit --config <this file> --project pivota-shared \
#     --substitutions=COMMIT_SHA=$(git rev-parse HEAD) .
substitutions:
  _REGION: us-west1
  _REPO: pivota
  _IMAGE: gateway
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest',
           # Stamps /app/.image_commit_sha inside the image. PIVOTA-Agent's src/config/platform.js
           # prefers that file over PIVOTA_COMMIT_SHA, so /health cannot report a commit the image
           # was not built from - see that repo's Dockerfile for the revision this happened to.
           # Without this substitution the arg is empty and the reader falls back to the env chain,
           # so a build that forgets it degrades to the old behaviour rather than lying.
           '--build-arg', 'COMMIT_SHA=${COMMIT_SHA}',
           '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
