# Build + push the backend image to the shared Artifact Registry.
#   gcloud builds submit --config infra/gcp/cloudbuild.backend.yaml --project pivota-shared \
#     --substitutions=COMMIT_SHA=$(git rev-parse HEAD) .
# (The COMMIT_SHA substitution is auto-populated by a Cloud Build GitHub trigger; pass it by hand for manual builds.)
substitutions:
  _REGION: us-west1
  _REPO: pivota
  _IMAGE: backend
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build',
           # -f: the Dockerfile deliberately does NOT live at the repo root. Railway auto-detects a
           # root Dockerfile and silently switches every service in this repo from Railpack to it
           # (prod `web` healthcheck-failed on 2026-08-19 for exactly this reason).
           '-f', 'infra/gcp/Dockerfile',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest',
           '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
           # Stamps /app/.image_commit_sha inside the image - see the Dockerfile for why the
           # deploy-time env var alone was not enough.
           '--build-arg', 'COMMIT_SHA=${COMMIT_SHA}',
           '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
