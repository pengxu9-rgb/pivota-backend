# Partner sandbox: Cloud Run `gateway` (PIVOTA-Agent image) behind https://@@GATEWAY_HOST@@.
# Rendered by deploy_sandbox.sh (@@TOKENS@@ substituted), checked by check_profile.py.
# Based on staging `gateway` as of 2026-11-25 (names and non-secret flag values only).
# Every staging setting NOT carried over is listed with its reason in ../ENV_PROFILE.md.
# Secrets are mounted from ../secrets/gateway.list, never written here.

# -- identity ------------------------------------------------------------------------------------
PIVOTA_ENV: "sandbox"
# Second identity signal, rendered from config.sh SANDBOX_PROJECT: the gateway boot check and the
# backend guard both read it, and the deploy reads it back off every new revision.
GOOGLE_CLOUD_PROJECT: "@@SANDBOX_PROJECT@@"
mode: "production"
API_MODE: "REAL"
USE_MOCK: "false"
USE_HYBRID: "false"
INTERNAL_TEST_MODE: "false"
LOG_LEVEL: "info"
DB_AUTO_MIGRATE: "false"
# Four public request paths (taxonomyStore, telemetry outcomeStore, two layer1 sample stores) run the
# gateway's full migration set themselves unless this is "true": on a public gateway any caller could
# start one. The schema is applied once, deliberately, by RUNBOOK step 10b.
SKIP_DB_MIGRATIONS: "true"
DB_POOL_MAX: "3"

# -- sandbox contract: the gateway's boot check (src/config/sandbox.js, sandbox-gateway branch) runs
#    whenever PIVOTA_ENV=sandbox: ak_test_ keys only, `sandbox: true` on every MCP answer, copied
#    prices not relayed as stale. No NODE_ENV=production|test here (the check refuses both).

# -- the backend it talks to: the SANDBOX web only ----------------------------------------------
PIVOTA_API_BASE: "@@WEB_URL@@"
PIVOTA_BACKEND_BASE_URL: "@@WEB_URL@@"
DISCOVERY_PRODUCTS_SEARCH_BASE_URL: "@@WEB_URL@@"
PROMOTIONS_BACKEND_BASE_URL: "@@WEB_URL@@"
PROMOTIONS_MODE: "remote"
AGENT_AUTH_INTROSPECT_URL: "@@WEB_URL@@/agent/internal/auth/introspect"
# AGENT_AUTH_CACHE_* / AGENT_AUTH_INTROSPECT_TIMEOUT_MS: code defaults (staging values not read).

# -- purchase path: orchestrated start_purchase -> Reap sandbox -> AgenPaz page ------------------
ORCHESTRATED_PURCHASE_TOOL_ENABLED: "1"
AGENT_PURCHASE_ORDER_READ_ENABLED: "1"
GET_OFFERS_EMPTY_REASON: "on"
REAP_AGENTIC_LANE_ENABLED: "1"
REAP_AGENTIC_CART_LINK_LANE_ENABLED: "1"
REAP_AGENTIC_CREATE_ENABLED: "1"
REAP_AGENTIC_CART_LINK_ENRICHMENT_ENABLED: "0"
AGENPAS_ENABLED: "1"
AGENPAS_PUBLIC_BASE_URL: "@@AGENPAZ_PUBLIC_URL@@"
AGENPAS_CONSENT_ENABLED: "true"
AGENPAS_RAILS: "reap"
AGENT_CHECKOUT_STRICT: "1"
AGENT_CHECKOUT_STRICT_SUBMIT_PAYMENT_ENABLED: "1"
AGENT_CHECKOUT_ALLOW_TEST_IDENTITY: "0"
AGENT_CHECKOUT_ALLOW_TEST_PSP: "0"
AGENT_CHECKOUT_TEST_IDENTITY_WINDOW: "0"
AGENT_CHECKOUT_MCP_ENABLE_AP2_MANDATE: "0"

# -- doors the sandbox does not open (each would reach a merchant or need a signing key) ----------
AGENT_CHECKOUT_UCP_DISCOVERY_ENABLED: "0"
AGENT_CHECKOUT_UCP_TOOL_DOOR_ENABLED: "0"
AGENT_CHECKOUT_UCP_ESCALATION_ENABLED: "0"
AGENT_CHECKOUT_UCP_MERCHANT_PRICING_ENABLED: "0"
AGENT_CHECKOUT_UCP_SELLER_DISCOUNT_CODES_ENABLED: "0"
AGENT_CHECKOUT_HOSTED_LINK_ENABLED: "0"
AGENT_CHECKOUT_ACP_FEED_ENABLED: "0"
ACP_PUBLIC_FEED: "0"
UCP_WARM_HANDOFF_ENABLED: "0"
UCP_WARM_HANDOFF_INTERNAL_ROUTE_ENABLED: "0"
UCP_BUYER_AGENT_PROFILE_ENABLED: "0"
PUBLIC_READ_MCP_ENABLED: "0"
MCP_OAUTH_ENABLED: "0"
SERVICES_BOOKING_ENABLED: "false"

# -- no live reads, no store fetches, no background jobs, no LLM calls -----------------------------
SERVE_LIVE_MERCHANT_PRICE: "0"
UCP_LIVE_OFFER_READ: "0"
UCP_LIVE_SEARCH_READ: "0"
UCP_LIVE_PRODUCT_READ: "0"
UCP_LIVE_PDP_READ: "0"
GET_OFFERS_LIVE_CART: "0"
CAFE24_CATALOG_SEARCH: "0"
MERCHANT_VARIANT_SOURCING_ENABLED: "0"
PDP_IDENTITY_GRAPH_AUTO_ENABLE_LIVE: "0"
PDP_IDENTITY_AUTO_RESOLVE_ENABLED: "false"
PDP_CORE_PREWARM_ENABLED: "false"
AURORA_BFF_PDP_HOTSET_PREWARM_ENABLED: "false"
CREATOR_CATALOG_AUTO_SYNC_ENABLED: "false"
CATALOG_IMAGE_CACHE_BOOTSTRAP_ENABLED: "false"
CATALOG_IMAGE_CACHE_BOOTSTRAP_APPLY: "false"
CATALOG_IMAGE_CACHE_JOB_RUNNER_ENABLED: "false"
AURORA_TRAVEL_WEATHER_LIVE_ENABLED: "false"
LLM_KILL_SWITCH: "true"
VERTEX_AI_ENABLED: "false"
PIVOTA_INTENT_LLM_ENABLED: "false"
PDP_GROUNDED_PRODUCT_INTEL_ENABLED: "false"
FIND_PRODUCTS_MULTI_VECTOR_ENABLED: "false"

# -- catalog / search / offers behaviour, carried from staging so answers match ---------------------
BRAND_PAGE_USES_COMMERCE_INDEX: "true"
