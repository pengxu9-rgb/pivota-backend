SEARCH_CONTEXT_FAIL_OPEN_ENABLED: "true"
SEARCH_DEBUG_BUNDLE_RESPONSE_ENABLED: "false"
SEARCH_DOMAIN_CONDENSER_ENABLED: "false"
SEARCH_DOMAIN_HARD_FILTER_ENABLED: "true"
SEARCH_DOMAIN_HARD_FILTER_MODE: "balanced"
SEARCH_EXTERNAL_FILL_GATED: "true"
SEARCH_FORCE_CONTROLLED_RECALL_FOR_SCENARIO: "true"
