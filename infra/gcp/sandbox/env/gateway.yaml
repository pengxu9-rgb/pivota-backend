PROXY_SEARCH_FALLBACK_TIMEOUT_MS: "3500"
PROXY_SEARCH_INVOKE_FALLBACK_ENABLED: "true"
PROXY_SEARCH_PRIMARY_TIMEOUT_AFTER_RESOLVER_MISS_MS: "7000"
PROXY_SEARCH_ROUTE_PRIMARY_TIMEOUT_MS: "10000"
PROXY_SEARCH_SECONDARY_FALLBACK_MULTI_ENABLED: "true"
