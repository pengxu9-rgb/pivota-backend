FIND_PRODUCTS_MULTI_UPSTREAM_LOOKUP_TIMEOUT_MS: "5000"
FIND_PRODUCTS_USES_CATALOG_ROW_TRUST: "true"
GATEWAY_DYNAMIC_BRAND_DETECT: "1"
