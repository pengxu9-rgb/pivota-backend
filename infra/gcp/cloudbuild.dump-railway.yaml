# Dump the Railway production Postgres into GCS from INSIDE GCP (us-west1 <-> Railway us-west is fast;
# the laptop network is not). Then: infra/gcp/restore_to_cloudsql.sh staging gs://.../prod-<ts>.sql.gz
#
#   gcloud builds submit --no-source --config infra/gcp/cloudbuild.dump-railway.yaml --project pivota-prod \
#     --substitutions=_BUCKET=pivota-prod-migration,_STAMP=$(date -u +%Y%m%dT%H%MZ)
#
# Requires secret `railway-prod-db-url` (Railway DATABASE_PUBLIC_URL) in the project, readable by the build SA.
#
# RUN THIS IN pivota-prod, NOT pivota-staging. The dump is PRODUCTION data and belongs in a
# production bucket; running the job in the prod project means the prod compute SA (already
# storage.objectAdmin + secretmanager.secretAccessor there) writes to its own bucket, with no
# cross-project grant at all. `railway-prod-db-url` exists in both projects, so nothing else moves.
#
# Do NOT instead grant the staging build SA access to the prod bucket: `gsutil cp` needs
# storage.objects.LIST, so the only grant that works is one that also lets staging READ every
# production dump - which is the exposure this change exists to remove. Verified the hard way:
# objectCreator alone fails with "does not have storage.objects.list access".
substitutions:
  # PRODUCTION DATA GOES IN A PRODUCTION BUCKET. This defaulted to the STAGING project's bucket,
  # so every prod dump - including the cutover snapshot, full of real buyer PII - landed where
  # `projectViewer:pivota-staging` could read it. That grant is structural: it survives the next
  # person added to staging. Moved 2026-08-22; see infra/gcp/README.md item 11.
  _BUCKET: pivota-prod-migration
  _STAMP: manual
  _SECRET: railway-prod-db-url   # Secret Manager entry holding the SOURCE Railway DSN
  _NAME: prod                    # object basename: gs://<bucket>/<name>-<stamp>.sql.gz
  # `require` for the main DB. The pci_kb Railway TCP proxy does NOT terminate TLS, so it needs
  # `prefer` (negotiate, fall back to plaintext). Only lower this for a source that refuses SSL, and
  # only when the content justifies an unencrypted hop - pci_kb is public reference data
  # (ingredients, papers, KB snippets), no credentials and no buyer PII.
  _SSLMODE: require
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET}/versions/latest
      env: RAILWAY_DB_URL
steps:
  - name: postgres:17
    id: dump
    secretEnv: [RAILWAY_DB_URL]
    entrypoint: bash
    args:
      - -ceuo
      - pipefail
      - |
        echo "pg_dump $(pg_dump --version) -> /workspace/prod.sql.gz"
        # -o pipefail is LOAD-BEARING: without it a pg_dump that dies mid-stream still leaves gzip
        # exiting 0, the step passes, and a PARTIAL database gets imported over the cutover window.
        # Append the sslmode parameter with the right separator; the URL may already carry a query.
        case "$${RAILWAY_DB_URL}" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
        echo "sslmode=${_SSLMODE}"
        pg_dump "$${RAILWAY_DB_URL}$${SEP}sslmode=${_SSLMODE}" --no-owner --no-privileges --format=plain \
          | gzip -1 > /workspace/prod.sql.gz
        ls -la /workspace/prod.sql.gz

        # Independent completeness checks: pg_dump writes this trailer LAST, so its presence proves
        # the stream ran to the end. Then compare table counts against the live source.
        gzip -cd /workspace/prod.sql.gz | tail -5 | grep -q 'PostgreSQL database dump complete' \
          || { echo "FATAL: dump has no completion trailer - TRUNCATED"; exit 1; }
        DUMPED=$(gzip -cd /workspace/prod.sql.gz | grep -c '^CREATE TABLE ')
        # Count EVERY non-system schema: pg_dump dumps them all, so restricting the live side to
        # 'public' under-counts and false-alarms on any database that uses a second schema.
        LIVE=$(psql "$${RAILWAY_DB_URL}$${SEP}sslmode=${_SSLMODE}" -Atc \
          "select count(*) from information_schema.tables
             where table_schema not in ('pg_catalog','information_schema')
               and table_schema not like 'pg_toast%' and table_type='BASE TABLE'")
        echo "tables: dumped=$${DUMPED} live=$${LIVE}"
        # Fail only on a SHORTFALL. The dump legitimately carries more CREATE TABLE statements than
        # this query counts (partitions, extension-owned tables); fewer means we lost something.
        [ "$${DUMPED}" -ge "$${LIVE}" ] || { echo "FATAL: dump has FEWER tables than the source - truncated"; exit 1; }
        echo "$${DUMPED}" > /workspace/table_count.txt
  - name: gcr.io/cloud-builders/gsutil
    id: upload
    args: ['cp', '/workspace/prod.sql.gz', 'gs://${_BUCKET}/${_NAME}-${_STAMP}.sql.gz']
  - name: gcr.io/cloud-builders/gsutil
    id: upload-manifest
    args: ['cp', '/workspace/table_count.txt', 'gs://${_BUCKET}/${_NAME}-${_STAMP}.tables']
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 100
timeout: 7200s
