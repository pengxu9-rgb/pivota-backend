# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7c97247555f2ca1330705c230832b070"
name = "Pivota"
application_url = "https://api.pivota.cc/integrations/shopify/app"
embedded = false

[webhooks]
# Pinned to match the version the backend registers/calls everywhere
# (DEFAULT_API_VERSION in services/shopify_integration_verify.py; the
# /admin/api/2025-10/webhooks.json REST path in routes/webhook_routes.py).
# Keep this in lockstep with the code when bumping (audit D3, resolved).
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "https://api.pivota.cc/webhooks/shopify/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  # App A holds no write_webhooks scope and cannot self-register per-merchant
  # webhooks; these app-owned subscriptions are its ONLY order-delivery path.
  # They deliver to the static endpoint that resolves the merchant from
  # X-Shopify-Shop-Domain (routes/webhook_routes.py POST /webhooks/shopify/orders).
  #
  # Every topic services/shopify_commerce_event_adapter.py maps into the
  # canonical ledger must be listed here, or App Store installs never deliver
  # it: until 2026-09-04 only orders/paid was, so orders/create,
  # orders/cancelled and refunds/create were invisible for those merchants.
  # tests/test_shopify_refund_webhook_subscription.py pins this list against
  # the adapter. A change here takes effect only after `shopify app deploy`
  # publishes a new app version; merging the file does nothing by itself.
  [[webhooks.subscriptions]]
  uri = "https://api.pivota.cc/webhooks/shopify/orders"
  topics = [ "orders/create", "orders/paid", "orders/cancelled", "refunds/create", "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_discounts,read_fulfillments,read_orders,read_products,write_pixels"
optional_scopes = [ ]
# Managed install (legacy flow removed 2026-07-07): required for the app-owned
# [[webhooks.subscriptions]] above — Shopify rejects app-specific webhooks under
# use_legacy_install_flow. Scopes are now granted from this declared set at
# install time (Shopify-managed) rather than the OAuth `scope=` param.
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://api.pivota.cc/integrations/shopify/oauth/callback" ]
